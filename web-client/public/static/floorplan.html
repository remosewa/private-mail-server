  // a single end-to-end exterior dimension.
}

// One inner-dimension segment from `from`..`to` (along the wall) with a given
// label length, offset to the dim side.
function drawInnerSeg(layer, w, ux, uy, nx, ny, innerOff, from, to, labelLen) {
  const a = { x: w.x1 + from * ux, y: w.y1 + from * uy };
  const b = { x: w.x1 + to * ux, y: w.y1 + to * uy };
  const ad = { x: a.x + nx * innerOff, y: a.y + ny * innerOff };
  const bd = { x: b.x + nx * innerOff, y: b.y + ny * innerOff };
  dimExtLine(layer, a, ad, 'dim-ext');
  dimExtLine(layer, b, bd, 'dim-ext');
  const sa = toScreen(ad.x, ad.y), sb = toScreen(bd.x, bd.y);
  const mid = { x: (sa.x + sb.x) / 2, y: (sa.y + sb.y) / 2 };
  layer.appendChild(makeSVGEl('line', { x1: sa.x, y1: sa.y, x2: sb.x, y2: sb.y, class: 'dim-line' }));
  dimLabel(layer, mid, fmtFt(labelLen), 'dim-text', 44, 18);
}

// Outer-overall dimension for a run of collinear, end-connected walls — treats
// the whole run as one physical wall so the exterior reads as a single span.
function drawRunOuterDimension(layer, run) {
  if (run.every(isInteriorPartition)) return;            // interior partition — no outer dim
  const w0 = run[0];
  const { ux, uy, nx: bnx, ny: bny } = wallDir(w0);

  // Extreme endpoints of the run along its direction.
  let minP = Infinity, maxP = -Infinity, minPt = null, maxPt = null, minW = w0, maxW = w0;
  for (const w of run) {
    for (const ep of [{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }]) {
      const p = (ep.x - w0.x1) * ux + (ep.y - w0.y1) * uy;
      if (p < minP) { minP = p; minPt = ep; minW = w; }
      if (p > maxP) { maxP = p; maxPt = ep; maxW = w; }
    }
  }
  // Corner-wrap trims from the perpendicular walls at the run's two true ends.
  const d1 = innerTrimAt(minW, minPt.x, minPt.y);
  const d2 = innerTrimAt(maxW, maxPt.x, maxPt.y);
  if (d1 < 0.02 && d2 < 0.02) return;                    // free-floating run — no outer dim

  const flip = w0.flipDim ? -1 : 1;
  const nx = bnx * flip, ny = bny * flip;
  const thick = w0.thickness ?? 0.5;
  const hasOpenings = run.some(w => State.openings.some(o => o.wallId === w.id));
  const outerOff = thick * 0.5 + (hasOpenings ? 1.85 : 1.35);

  const op1 = { x: minPt.x - d1 * ux, y: minPt.y - d1 * uy };
  const op2 = { x: maxPt.x + d2 * ux, y: maxPt.y + d2 * uy };
  const outerLen = (maxP - minP) + d1 + d2;
  const op1d = { x: op1.x + nx * outerOff, y: op1.y + ny * outerOff };
  const op2d = { x: op2.x + nx * outerOff, y: op2.y + ny * outerOff };
  dimExtLine(layer, op1, op1d, 'dim-ext-ctr');
  dimExtLine(layer, op2, op2d, 'dim-ext-ctr');
  const so1 = toScreen(op1d.x, op1d.y), so2 = toScreen(op2d.x, op2d.y);
  const miO = { x: (so1.x + so2.x) / 2, y: (so1.y + so2.y) / 2 };
  layer.appendChild(makeSVGEl('line', { x1: so1.x, y1: so1.y, x2: so2.x, y2: so2.y, class: 'dim-line-ctr' }));
  dimLabel(layer, miO, fmtFt(outerLen), 'dim-text-ctr', 36, 14);
}

function dimExtLine(layer, from, to, cls) {
  const sf = toScreen(from.x, from.y);
  const st = toScreen(to.x, to.y);
  layer.appendChild(makeSVGEl('line', { x1: sf.x, y1: sf.y, x2: st.x, y2: st.y, class: cls }));
}

function dimLabel(layer, screenMid, text, textClass, w, h) {
  layer.appendChild(makeSVGEl('rect', {
    x: screenMid.x - w / 2, y: screenMid.y - h / 2, width: w, height: h,
    rx: 3, class: 'dim-text-bg',
  }));
  const txt = makeSVGEl('text', { x: screenMid.x, y: screenMid.y, class: textClass });
  txt.textContent = text;
  layer.appendChild(txt);
}

function drawFurnitureDimension(layer, f) {
  const c = toScreen(f.x, f.y);
  const fw = f.width * State.scale;
  const fh = f.height * State.scale;

  // Width dim below
  const sy = c.y + fh / 2 + 14;
  layer.appendChild(makeSVGEl('line', { x1: c.x - fw / 2, y1: sy, x2: c.x + fw / 2, y2: sy, class: 'dim-line' }));
  dimLabel(layer, { x: c.x, y: sy }, fmtFt(f.width), 'dim-text', 40, 16);

  // Height dim to right (always — ovals have independent width/height)
  const sx = c.x + fw / 2 + 14;
  layer.appendChild(makeSVGEl('line', { x1: sx, y1: c.y - fh / 2, x2: sx, y2: c.y + fh / 2, class: 'dim-line' }));
  dimLabel(layer, { x: sx, y: c.y }, fmtFt(f.height), 'dim-text', 40, 16);
}

// ── Angle markers ─────────────────────────────────────────────────────────
function renderAngles() {
  const layer = document.getElementById('layer-angles');
  layer.innerHTML = '';
  if (!State.showDimensions) return;

  // Build adjacency: for each endpoint find all walls sharing it
  const eps = {};
  const addEp = (key, wallId, isStart) => {
    if (!eps[key]) eps[key] = [];
    eps[key].push({ wallId, isStart });
  };

  for (const w of State.walls) {
    const k1 = `${Math.round(w.x1 * 100)},${Math.round(w.y1 * 100)}`;
    const k2 = `${Math.round(w.x2 * 100)},${Math.round(w.y2 * 100)}`;
    addEp(k1, w.id, true);
    addEp(k2, w.id, false);
  }

  for (const [key, entries] of Object.entries(eps)) {
    if (entries.length < 2) continue;
    const [kx, ky] = key.split(',').map(Number);
    const cx = kx / 100, cy = ky / 100;

    // Get directions of each wall going away from this endpoint
    const dirs = entries.map(e => {
      const w = State.getWall(e.wallId);
      const dx = e.isStart ? w.x2 - w.x1 : w.x1 - w.x2;
      const dy = e.isStart ? w.y2 - w.y1 : w.y1 - w.y2;
      const L = Math.sqrt(dx * dx + dy * dy) || 1;
      return { ax: dx / L, ay: dy / L };
    });

    // For pairs of walls, draw angle if not 90°
    for (let i = 0; i < dirs.length - 1; i++) {
      for (let j = i + 1; j < dirs.length; j++) {
        const dot = dirs[i].ax * dirs[j].ax + dirs[i].ay * dirs[j].ay;
        const angleDeg = Math.acos(clamp(dot, -1, 1)) * 180 / Math.PI;
        // Skip exact multiples of 90° (0°, 90°, 180°) — tight 0.1° tolerance
        if (angleDeg % 90 < 0.1 || angleDeg % 90 > 89.9) continue;

        const cs = toScreen(cx, cy);
        const r = 22;
        const a1 = Math.atan2(dirs[i].ay, dirs[i].ax) * 180 / Math.PI;
        const a2 = Math.atan2(dirs[j].ay, dirs[j].ax) * 180 / Math.PI;

        // Pick the short arc (the one that matches angleDeg).
        // cwSpan = clockwise angular distance from a1 to a2.
        // If > 180° we're going the long way — swap start/end to take the short arc.
        const cwSpan   = ((a2 - a1) + 360) % 360;
        const arcStart = cwSpan <= 180 ? a1 : a2;
        const arcEnd   = cwSpan <= 180 ? a2 : a1;
        const arcSpan  = cwSpan <= 180 ? cwSpan : 360 - cwSpan;

        const arc = makeSVGEl('path', {
          d: svgArc(cs.x, cs.y, r, arcStart, arcEnd),
          class: 'angle-arc',
        });
        layer.appendChild(arc);

        const midA = arcStart + arcSpan / 2;
        const tx = cs.x + (r + 12) * Math.cos(midA * Math.PI / 180);
        const ty = cs.y + (r + 12) * Math.sin(midA * Math.PI / 180);

        const txt = makeSVGEl('text', { x: tx, y: ty, class: 'angle-text' });
        txt.textContent = fmtAngle(angleDeg);
        layer.appendChild(txt);
      }
    }
  }
}

// ── Selection highlight ───────────────────────────────────────────────────
// Lightweight highlight for one item, used for group (multi) selection.
function drawItemHighlight(layer, ref) {
  if (ref.type === 'wall') {
    const w = State.getWall(ref.id);
    if (!w) return;
    const p1 = toScreen(w.x1, w.y1), p2 = toScreen(w.x2, w.y2);
    const thickPx = (w.thickness ?? 0.5) * State.scale;
    layer.appendChild(makeSVGEl('line', {
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      stroke: '#ff6600', 'stroke-width': Math.max(thickPx + 4, 5),
      'stroke-opacity': 0.4, 'pointer-events': 'none',
    }));
  } else if (ref.type === 'furniture') {
    const f = State.getFurniture(ref.id);
    if (!f) return;
    const c = toScreen(f.x, f.y);
    const w = f.width * State.scale, h = f.height * State.scale;
    layer.appendChild(makeSVGEl('rect', {
      x: c.x - w / 2, y: c.y - h / 2, width: w, height: h,
      class: 'selection-box', transform: `rotate(${f.rotation || 0},${c.x},${c.y})`,
    }));
  } else if (ref.type === 'label') {
    const l = State.getLabel(ref.id);
    if (!l) return;
    const sc = toScreen(l.x, l.y);
    const fsPx = l.fontSize * State.scale;
    const hw = fsPx * 0.55 * (l.text.length || 1) / 2;
    const hh = fsPx * 0.6;
    layer.appendChild(makeSVGEl('rect', {
      x: sc.x - hw - 3, y: sc.y - hh - 3, width: hw * 2 + 6, height: hh * 2 + 6,
      class: 'selection-box',
    }));
  }
}

function renderSelection() {
  const layer = document.getElementById('layer-selection');
  layer.innerHTML = '';

  // Group selection: draw a simple highlight per item (no resize handles)
  if (State.selection.length > 1) {
    for (const ref of State.selection) drawItemHighlight(layer, ref);
    return;
  }

  if (!State.selected) return;

  const { type, id } = State.selected;

  if (type === 'wall') {
    const w = State.getWall(id);
    if (!w) return;
    const p1 = toScreen(w.x1, w.y1);
    const p2 = toScreen(w.x2, w.y2);
    const thickPx = (w.thickness ?? 0.5) * State.scale;

    const hl = makeSVGEl('line', {
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      stroke: '#ff6600', 'stroke-width': thickPx + 4,
      'stroke-opacity': 0.4, 'pointer-events': 'none',
    });
    layer.appendChild(hl);

    // Endpoint handles — draggable to resize/reshape the wall
    [{ x: w.x1, y: w.y1, end: 1 }, { x: w.x2, y: w.y2, end: 2 }].forEach(ep => {
      const sp = toScreen(ep.x, ep.y);
      layer.appendChild(makeSVGEl('circle', {
        cx: sp.x, cy: sp.y, r: 6, class: 'handle',
        'data-drag': 'wall-end', 'data-end': ep.end, style: 'cursor:move',
      }));
    });
  }

  if (type === 'furniture') {
    const f = State.getFurniture(id);
    if (!f) return;
    const c = toScreen(f.x, f.y);
    const w = f.width * State.scale;
    const h = f.height * State.scale;
    const rot = f.rotation || 0;

    // Outline hugs the exact footprint — the dashed box IS the furniture's size.
    const box = makeSVGEl('rect', {
      x: c.x - w / 2, y: c.y - h / 2, width: w, height: h,
      class: 'selection-box',
      transform: `rotate(${rot},${c.x},${c.y})`,
    });
    layer.appendChild(box);

    // Resize handle (bottom-right)
    const hx = c.x + w / 2;
    const hy = c.y + h / 2;
    const rotRad = rot * Math.PI / 180;
    const rhx = c.x + (hx - c.x) * Math.cos(rotRad) - (hy - c.y) * Math.sin(rotRad);
    const rhy = c.y + (hx - c.x) * Math.sin(rotRad) + (hy - c.y) * Math.cos(rotRad);

    const handle = makeSVGEl('rect', {
      x: rhx - 5, y: rhy - 5, width: 10, height: 10,
      class: 'handle', 'data-drag': 'resize', style: 'cursor:nwse-resize',
    });
    layer.appendChild(handle);
  }

  if (type === 'tile') {
    const tf = State.getTileFill(id);
    if (!tf || !tf.roomPoly) return;
    const pts = tf.roomPoly.map(p => { const s = toScreen(p.x, p.y); return `${s.x},${s.y}`; }).join(' ');
    layer.appendChild(makeSVGEl('polygon', {
      points: pts, fill: 'none', stroke: '#ff6600', 'stroke-width': 2,
      'stroke-dasharray': '6,4', 'pointer-events': 'none',
    }));
  }

  if (type === 'opening') {
    // simple orange dot on center
    const o = State.getOpening(id);
    if (!o) return;
    const w = State.getWall(o.wallId);
    if (!w) return;
    const cw = wallPoint(w, o.t);
    const cs = toScreen(cw.x, cw.y);
    const dot = makeSVGEl('circle', {
      cx: cs.x, cy: cs.y, r: 5, fill: '#ff6600', 'pointer-events': 'none',
    });
    layer.appendChild(dot);
  }
}

// ── Preview ───────────────────────────────────────────────────────────────
function renderPreview(layer) {
  layer.innerHTML = '';
  if (!State.drawing || !State.drawStart) return;

  const from = State.chainEnd || State.drawStart;
  const to = State.mouseWorld;
  const p1 = toScreen(from.x, from.y);
  const p2 = toScreen(to.x, to.y);

  const L = dist(from.x, from.y, to.x, to.y);
  if (L < 0.01) return;

  layer.appendChild(makeSVGEl('line', {
    x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
    'stroke-width': 2, class: 'preview-wall',
  }));

  // Use previewDisplayLen (set by wallSnapPoint for interior/exterior mode + inch snap).
  // Fallback (endpoint/centerline-snapped ends): real trims at connected ends,
  // assumed own half-thickness at free ends — same rules as the placed label.
  let shownLen;
  if (State.previewDisplayLen != null) {
    shownLen = State.previewDisplayLen;
    State.previewDisplayLen = null;
  } else {
    const thick = State.newWallThickness ?? 0.5;
    const tempWall = { id: -999, x1: from.x, y1: from.y, x2: to.x, y2: to.y, thickness: thick };
    const t1 = innerTrimAt(tempWall, from.x, from.y);
    const t2 = innerTrimAt(tempWall, to.x, to.y);
    const assumed = State.interiorMode ? thick / 2 : 0;
    shownLen = Math.max(0, L - (t1 > 0.02 ? t1 : assumed) - (t2 > 0.02 ? t2 : assumed));
  }

  const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
  const txt = makeSVGEl('text', { x: mid.x, y: mid.y - 10, class: 'preview-dim' });
  txt.textContent = fmtFt(shownLen);
  layer.appendChild(txt);
}

function renderOpeningPreview(layer, wx, wy) {
  layer.innerHTML = '';
  const hit = nearestWall(wx, wy, 1.5);
  if (!hit) return;

  const cw = wallPoint(hit.wall, hit.t);
  const cs = toScreen(cw.x, cw.y);
  const dot = makeSVGEl('circle', { cx: cs.x, cy: cs.y, r: 6, fill: '#e94560', 'pointer-events': 'none' });
  layer.appendChild(dot);
}

function renderSnapIndicator(layer, wx, wy) {
  if (!State.snapToGrid) return;

  // Mid-wall (T-junction) snap: marker + distance from each end of the wall.
  if (State.wallCenterSnap) {
    renderWallCenterSnap(layer, State.wallCenterSnap);
    return;
  }

  const ep = snapToEndpoints(wx, wy);
  if (!ep) return;
  const sp = toScreen(ep.x, ep.y);
  const sq = makeSVGEl('rect', {
    x: sp.x - 6, y: sp.y - 6, width: 12, height: 12,
    class: 'snap-indicator',
  });
  layer.appendChild(sq);
}

function renderWallCenterSnap(layer, cs) {
  const w = cs.wall;
  const { ux, uy, nx, ny } = wallDir(w);
  const sp = toScreen(cs.x, cs.y);

  // Perpendicular tick across the wall + a marker dot at the snap point.
  const half = ((w.thickness ?? 0.5) / 2 + 0.15) * State.scale;
  layer.appendChild(makeSVGEl('line', {
    x1: sp.x - nx * half, y1: sp.y - ny * half, x2: sp.x + nx * half, y2: sp.y + ny * half,
    class: 'snap-tick',
  }));
  layer.appendChild(makeSVGEl('circle', { cx: sp.x, cy: sp.y, r: 4, class: 'snap-center-dot' }));

  // Distance dims from the nearest bounding wall on each side to the *edge* of
  // the wall about to be placed (its footprint is shown as a band), drawn on the
  // side of the wall the cursor is on.
  const halfNew = cs.halfNew || 0;
  const startEdge = { x: cs.x - halfNew * ux, y: cs.y - halfNew * uy };
  const endEdge = { x: cs.x + halfNew * ux, y: cs.y + halfNew * uy };

  // Footprint band of the wall about to be placed (its width along this wall).
  if (halfNew > 0.001) {
    const ea = toScreen(startEdge.x, startEdge.y), eb = toScreen(endEdge.x, endEdge.y);
    layer.appendChild(makeSVGEl('line', {
      x1: ea.x, y1: ea.y, x2: eb.x, y2: eb.y,
      stroke: '#ff6600', 'stroke-width': Math.max((State.newWallThickness ?? 0.5) * State.scale, 2),
      'stroke-opacity': 0.3, 'pointer-events': 'none',
    }));
  }

  const boundA = { x: w.x1 + cs.startBound * ux, y: w.y1 + cs.startBound * uy };
  const boundB = { x: w.x1 + cs.endBound * ux, y: w.y1 + cs.endBound * uy };
  const off = (cs.side || 1) * ((w.thickness ?? 0.5) / 2 + 0.45);
  if (cs.fromStart > 0.02) snapDistDim(layer, boundA, startEdge, nx, ny, off, fmtFt(cs.fromStart));
  if (cs.fromEnd > 0.02) snapDistDim(layer, endEdge, boundB, nx, ny, off, fmtFt(cs.fromEnd));
}

function snapDistDim(layer, a, b, nx, ny, off, text) {
  if (dist(a.x, a.y, b.x, b.y) < 0.04) return;
  const pa = toScreen(a.x + nx * off, a.y + ny * off);
  const pb = toScreen(b.x + nx * off, b.y + ny * off);
  layer.appendChild(makeSVGEl('line', { x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y, class: 'dim-line' }));
  dimExtLine(layer, a, { x: a.x + nx * off, y: a.y + ny * off }, 'dim-ext');
  dimExtLine(layer, b, { x: b.x + nx * off, y: b.y + ny * off }, 'dim-ext');
  dimLabel(layer, { x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 }, text, 'dim-text', 44, 18);
}


// ===== tools.js =====
'use strict';

let panStart = null;
let spaceDown = false;
let preDragSnap = null;    // snapshot taken at drag start
let dragMoved = false;     // did the drag actually move anything?
let marquee = null;        // {x1,y1,x2,y2} world coords of selection box
let groupOrig = null;      // [{type,id,data}] original positions for group move
let paintSession = null;   // {id, target} active mosaic drag-paint
let mosaicSel = null;      // {id,x1,y1,x2,y2} shift-drag region for copying a design
let furnDragRaw = null;    // unsnapped cursor at furniture-drag start (furniture snaps by edges, not center)

function getSVGPoint(e) {
  const svg = document.getElementById('canvas');
  const rect = svg.getBoundingClientRect();
  return { sx: e.clientX - rect.left, sy: e.clientY - rect.top };
}

function getWorldPoint(e) {
  const { sx, sy } = getSVGPoint(e);
  const raw = toWorld(sx, sy);
  if (!State.snapToGrid) return raw;
  // Inner corner snaps first (aligns furniture to wall faces), then plain
  // endpoints, then fall back to the nearest inch grid.
  return innerCornerSnaps(raw.x, raw.y, 0.5) || snapToEndpoints(raw.x, raw.y, 0.5) || snapToInchGrid(raw.x, raw.y);
}

// Find the nearest ancestor (or self) that carries data-type
function elementTarget(el) {
  return el.closest('[data-type]') || null;
}

function initTools() {
  const canvas = document.getElementById('canvas');
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('dblclick', onDblClick);
  canvas.addEventListener('contextmenu', onContextMenu);
  canvas.addEventListener('wheel', onWheel, { passive: false });

  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
}

function onMouseDown(e) {
  const isPan = spaceDown || e.button === 1 || (e.button === 0 && e.altKey);
  if (isPan) {
    panStart = { sx: e.clientX, sy: e.clientY, px: State.panX, py: State.panY };
    document.getElementById('canvas-container').classList.add('panning');
    return;
  }
  if (e.button !== 0) return;

  // A left click dismisses the measuring reference.
  if (State.referencePoint) {
    State.referencePoint = null;
    renderReference();
    updateReferenceReadout();
  }

  const wp = getWorldPoint(e);
  const tool = State.tool;

  if (tool === 'select') handleSelectDown(e, wp);
  else if (tool === 'wall') handleWallDown(e, wp);
  else if (tool === 'door' || tool === 'window') handleOpeningDown(e, wp, tool);
  else if (tool === 'rect' || tool === 'circle') handleFurnitureDown(e, wp, tool);
  else if (tool === 'label') handleLabelDown(e, wp);
  else if (tool === 'tile') handleTileDown(e, wp);
  else if (tool === 'mosaic') handleMosaicDown(e, wp);
}

// Right-click: while drawing a wall it cancels the chain; otherwise it sets (or
// moves) the measurement reference point, snapping to corners/endpoints.
function onContextMenu(e) {
  e.preventDefault();
  if (State.drawing) { cancelDraw(); return; }

  // The measuring tool is deliberately un-snapped — exact cursor position.
  const { sx, sy } = getSVGPoint(e);
  const raw = toWorld(sx, sy);
  State.referencePoint = { x: raw.x, y: raw.y };
  State.rawMouseWorld = raw;
  render();
  updateReferenceReadout();
  setHint('Reference set. Distance shown on the line and in the status bar. Right-click to move it, or clear it in the status bar.');
}

function onMouseMove(e) {
  if (panStart) {
    State.panX = panStart.px + (e.clientX - panStart.sx);
    State.panY = panStart.py + (e.clientY - panStart.sy);
    render();
    return;
  }

  const { sx, sy } = getSVGPoint(e);
  const rawWorld = toWorld(sx, sy);
  State.rawMouseWorld = rawWorld;     // exact cursor — measuring tool ignores snap
  const preview = document.getElementById('layer-preview');

  if (State.tool === 'wall') {
    // Wall drawing uses angle snap; everything else uses raw position
    let wp;
    if (State.drawing) {
      wp = wallSnapPoint(rawWorld.x, rawWorld.y);   // sets State.wallCenterSnap
    } else if (State.snapToGrid) {
      const ep = snapToEndpoints(rawWorld.x, rawWorld.y, 0.5);
      if (ep) { wp = ep; State.wallCenterSnap = null; }
      else {
        const cl = snapToWallCenterline(rawWorld.x, rawWorld.y);
        if (cl) { wp = { x: cl.x, y: cl.y }; State.wallCenterSnap = cl; }
        else { wp = snapToInchGrid(rawWorld.x, rawWorld.y); State.wallCenterSnap = null; }
      }
    } else { wp = rawWorld; State.wallCenterSnap = null; }
    State.mouseWorld = wp;
    updateStatusCoords(wp);
    updateReferenceReadout();
    if (State.drawing) {
      renderPreview(preview);
      renderSnapIndicator(preview, wp.x, wp.y);
    } else {
      preview.innerHTML = '';
      renderSnapIndicator(preview, wp.x, wp.y);
    }
    return;
  }

  if (State.tool === 'mosaic') {
    // Drag-paint: paint every tile cell dragged over to the same value.
    if (paintSession) {
      const tgt = elementTarget(e.target);
      if (tgt && tgt.dataset.type === 'tile' && parseInt(tgt.dataset.id) === paintSession.id) {
        const tf = State.getTileFill(paintSession.id);
        if (tf) {
          const k = tileCellAt(tf, rawWorld.x, rawWorld.y).key;
          const cur = tf.painted[k] ? 1 : 0;
          if (cur !== paintSession.target) { applyPaint(tf, k, paintSession.target); repaintTileAccent(tf); }
        }
      }
      return;
    }
    // Shift-drag: update the copy-region marquee.
    if (State.dragType === 'mosaicSelect' && mosaicSel) {
      mosaicSel.x2 = rawWorld.x; mosaicSel.y2 = rawWorld.y;
      drawMosaicMarquee();
      return;
    }
    // Armed with a copied design: show a ghost preview at the cursor.
    if (State.tileStamp) {
      preview.innerHTML = '';
      const tgt = elementTarget(e.target);
      if (tgt && tgt.dataset.type === 'tile') renderMosaicGhost(preview, parseInt(tgt.dataset.id), e);
      return;
    }
    preview.innerHTML = '';
    return;
  }

  const wp = getWorldPoint(e);
  State.mouseWorld = wp;
  updateStatusCoords(wp);
  updateReferenceReadout();

  if ((State.tool === 'door' || State.tool === 'window') && !State.dragging) {
    renderOpeningPreview(preview, rawWorld.x, rawWorld.y);
  } else if (State.tool === 'select' && State.dragging) {
    handleSelectDrag(e, wp);
  } else {
    preview.innerHTML = '';
  }
}

function onMouseUp(e) {
  if (panStart) {
    panStart = null;
    document.getElementById('canvas-container').classList.remove('panning');
    return;
  }
  if (e.button !== 0) return;

  if (State.dragging) {
    if (State.dragType === 'paint') {
      paintSession = null;
    } else if (State.dragType === 'mosaicSelect') {
      finalizeMosaicCopy();
    } else if (State.dragType === 'marquee') {
      finishMarquee();
    } else if (dragMoved && preDragSnap) {
      // Only save undo if something actually moved
      Undo.pushRaw(preDragSnap);
    }
    preDragSnap = null;
    dragMoved = false;
    groupOrig = null;
    wallEndDrag = null;
    furnDragRaw = null;
    State.dragging = false;
    State.dragType = null;
    State.dragStart = null;
    State.dragOrig = null;
    render();
    updatePropertiesPanel();
  }
}

function onDblClick(e) {
  if (State.tool === 'wall' && State.drawing) {
    finishWallChain();
    return;
  }
  if (State.tool === 'select') {
    const tgt = elementTarget(e.target);
    if (tgt) handleDblClickElement(tgt.dataset.type, parseInt(tgt.dataset.id));
  }
}

function onWheel(e) {
  e.preventDefault();
  const { sx, sy } = getSVGPoint(e);
  const worldBefore = toWorld(sx, sy);
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  State.scale = clamp(State.scale * factor, 10, 200);
  const worldAfter = toWorld(sx, sy);
  State.panX += (worldAfter.x - worldBefore.x) * State.scale;
  State.panY += (worldAfter.y - worldBefore.y) * State.scale;
  updateZoomLabel();
  render();
}

// ── Wall tool ─────────────────────────────────────────────────────────────
function handleWallDown(e, _wp) {
  // Always use angle-snapped position for wall placement
  const { sx, sy } = getSVGPoint(e);
  const raw = toWorld(sx, sy);
  const wp = State.drawing
    ? wallSnapPoint(raw.x, raw.y)
    : (State.snapToGrid ? (snapToEndpoints(raw.x, raw.y, 0.5) || snapToWallCenterline(raw.x, raw.y) || snapToInchGrid(raw.x, raw.y)) : raw);

  if (!State.drawing) {
    State.drawing = true;
    State.drawStart = wp;
    State.chainEnd = null;
    State.mouseWorld = wp;
    setHint('Click to add points. Double-click, Enter, or Esc to finish.');
  } else {
    const from = State.chainEnd || State.drawStart;
    const L = dist(from.x, from.y, wp.x, wp.y);
    if (L < 0.1) return;
    Undo.push();
    State.walls.push({ id: State.newId(), x1: from.x, y1: from.y, x2: wp.x, y2: wp.y, thickness: State.newWallThickness ?? 0.5 });
    State.chainEnd = wp;
    render();
  }
}

function finishWallChain() {
  State.drawing = false;
  State.drawStart = null;
  State.chainEnd = null;
  State.wallCenterSnap = null;
  document.getElementById('layer-preview').innerHTML = '';
  render();
  setHint('Click to select. Drag to move. Double-click to edit.');
}

function cancelDraw() {
  if (State.drawing) finishWallChain();
}

// ── Opening tool ──────────────────────────────────────────────────────────
function handleOpeningDown(e, wp, type) {
  const { sx, sy } = getSVGPoint(e);
  const rawWorld = toWorld(sx, sy);
  const hit = nearestWall(rawWorld.x, rawWorld.y, 1.5);
  if (!hit) return;

  const wl = hit.wall;
  const L  = wallLength(wl);
  const d1 = innerTrimAt(wl, wl.x1, wl.y1);
  const d2 = innerTrimAt(wl, wl.x2, wl.y2);
  const maxW = Math.max(0.5, L - d1 - d2);
  openEditOpeningModal(null, {
    type,
    wallId: wl.id,
    t: hit.t,
    width: Math.min(3, maxW),
    hinge: 'left',
    swingDir: 'in',
    label: '',
  });
}

// ── Furniture tool ────────────────────────────────────────────────────────
function handleFurnitureDown(e, wp, type) {
  // Don't corner-snap the CENTER at placement (that buries half the piece in
  // the wall) — inch grid only; dragging it afterwards snaps its edges flush.
  const { sx, sy } = getSVGPoint(e);
  const raw = toWorld(sx, sy);
  const p = State.snapToGrid ? snapToInchGrid(raw.x, raw.y) : raw;
  openEditFurnitureModal(null, {
    type,
    x: p.x, y: p.y,
    width: 4, height: type === 'circle' ? 4 : 2,
    rotation: 0,
    label: type === 'rect' ? 'Furniture' : '',
  });
}

// ── Tile tool ─────────────────────────────────────────────────────────────
function handleTileDown(e, wp) {
  // Room already tiled? Edit that fill instead of stacking a duplicate on top
  // (a hidden duplicate is why color changes appeared to "not take").
  for (let i = State.tilefills.length - 1; i >= 0; i--) {
    const tf = State.tilefills[i];
    if (tf.roomPoly && pointInPolygon(wp.x, wp.y, tf.roomPoly)) {
      State.setSelection([{ type: 'tile', id: tf.id }]);
      render();
      updatePropertiesPanel();
      openTileFillModal(tf.roomPoly, tf.id);
      return;
    }
  }
  const poly = findRoomPolygon(wp.x, wp.y);
  if (!poly) {
    setHint('No closed room here — tiles need a fully enclosed room.');
    return;
  }
  openTileFillModal(poly);
}

// ── Mosaic tool ───────────────────────────────────────────────────────────
// Click a tile to toggle it base<->accent; drag to paint several. Shift-drag
// copies a rectangular block of the design, which can then be stamped (pasted)
// repeatedly with single clicks. Esc cancels stamping.
function handleMosaicDown(e, wp) {
  const tgt = elementTarget(e.target);
  const overTile = tgt && tgt.dataset.type === 'tile';

  // Stamp mode: a plain click pastes the copied design.
  if (State.tileStamp && !e.shiftKey) {
    if (overTile) stampMosaicAt(parseInt(tgt.dataset.id), e);
    return;
  }

  if (!overTile) {
    setHint('Click a tile to recolor it. Shift-drag to copy a design to repeat.');
    return;
  }
  const tf = State.getTileFill(parseInt(tgt.dataset.id));
  if (!tf) return;

  // Shift-drag: marquee-select a region to copy.
  if (e.shiftKey) {
    const { sx, sy } = getSVGPoint(e);
    const raw = toWorld(sx, sy);
    mosaicSel = { id: tf.id, x1: raw.x, y1: raw.y, x2: raw.x, y2: raw.y };
    State.dragging = true;
    State.dragType = 'mosaicSelect';
    return;
  }

  // Paint a single cell (drag continues painting).
  const { sx, sy } = getSVGPoint(e);
  const raw = toWorld(sx, sy);
  const key = tileCellAt(tf, raw.x, raw.y).key;
  Undo.push();
  if (!tf.painted) tf.painted = {};
  const target = tf.painted[key] ? 0 : 1;
  paintSession = { id: tf.id, target };
  applyPaint(tf, key, target);
  repaintTileAccent(tf);
  State.dragging = true;
  State.dragType = 'paint';
}

function applyPaint(tf, key, target) {
  if (target) tf.painted[key] = 1;
  else delete tf.painted[key];
}

// Capture the painted cells inside the shift-drag marquee as a stamp.
function finalizeMosaicCopy() {
  const sel = mosaicSel;
  mosaicSel = null;
  document.getElementById('layer-preview').innerHTML = '';
  if (!sel) return;
  const tf = State.getTileFill(sel.id);
  if (!tf) return;
  const a = tileCellAt(tf, sel.x1, sel.y1), b = tileCellAt(tf, sel.x2, sel.y2);
  const c0 = Math.min(a.c, b.c), c1 = Math.max(a.c, b.c);
  const r0 = Math.min(a.r, b.r), r1 = Math.max(a.r, b.r);
  const set = new Set();
  const painted = tf.painted || {};
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (painted[`${c},${r}`]) set.add(`${c - c0},${r - r0}`);
  }
  if (!set.size) { setHint('No painted tiles in selection — nothing copied.'); return; }
  State.tileStamp = { w: c1 - c0 + 1, h: r1 - r0 + 1, set, hex: tf.shape === 'hex', srcR0: r0 };
  setHint(`Copied ${set.size}-tile design. Click to stamp it (repeat), Esc to cancel.`);
}

// Stamp origin cell for the cursor on a given fill (hex keeps row parity so the
// pattern doesn't shift half a column on odd rows).
function stampOrigin(tf, e) {
  const { sx, sy } = getSVGPoint(e);
  const raw = toWorld(sx, sy);
  const o = tileCellAt(tf, raw.x, raw.y);
  let tr = o.r;
  if (State.tileStamp.hex && ((tr - State.tileStamp.srcR0) & 1)) tr -= 1;
  return { c: o.c, r: tr };
}

// Paste the copied design onto the fill at the cursor (overwrites the block).
function stampMosaicAt(fillId, e) {
  const tf = State.getTileFill(fillId);
  const stamp = State.tileStamp;
  if (!tf || !stamp) return;
  const { c: tc, r: tr } = stampOrigin(tf, e);
  Undo.push();
  if (!tf.painted) tf.painted = {};
  for (let dr = 0; dr < stamp.h; dr++) for (let dc = 0; dc < stamp.w; dc++) {
    const key = `${tc + dc},${tr + dr}`;
    if (stamp.set.has(`${dc},${dr}`)) tf.painted[key] = 1;
    else delete tf.painted[key];
  }
  repaintTileAccent(tf);
}

function drawMosaicMarquee() {
  const layer = document.getElementById('layer-preview');
  layer.innerHTML = '';
  if (!mosaicSel) return;
  const a = toScreen(Math.min(mosaicSel.x1, mosaicSel.x2), Math.min(mosaicSel.y1, mosaicSel.y2));
  const b = toScreen(Math.max(mosaicSel.x1, mosaicSel.x2), Math.max(mosaicSel.y1, mosaicSel.y2));
  layer.appendChild(makeSVGEl('rect', { x: a.x, y: a.y, width: b.x - a.x, height: b.y - a.y, class: 'marquee-box' }));
}

// ── Select tool ───────────────────────────────────────────────────────────
let wallEndDrag = null;   // {end, conns:[{id,end}]} — endpoint being dragged + coincident ends

function handleSelectDown(e, wp) {
  // Wall endpoint handle: drag to resize/reshape, carrying connected walls along.
  if (e.target.dataset.drag === 'wall-end' && State.selected?.type === 'wall') {
    const w = State.getWall(State.selected.id);
    if (w) {
      const end = parseInt(e.target.dataset.end);
      const ex = end === 1 ? w.x1 : w.x2, ey = end === 1 ? w.y1 : w.y2;
      // Capture the connected ends ONCE at drag start, so corners we merely pass
      // over mid-drag don't get grabbed accidentally.
      const conns = [];
      for (const wo of State.walls) {
        if (wo.id === w.id) continue;
        if (dist(wo.x1, wo.y1, ex, ey) < 0.05) conns.push({ id: wo.id, end: 1 });
        if (dist(wo.x2, wo.y2, ex, ey) < 0.05) conns.push({ id: wo.id, end: 2 });
      }
      wallEndDrag = { end, conns };
      preDragSnap = State.snapshot();
      dragMoved = false;
      State.dragging = true;
      State.dragType = 'wallend';
      State.dragStart = wp;
      State.dragOrig = { ...w };
      return;
    }
  }

  // Resize handle has data-drag, not data-type — check it first
  if (e.target.dataset.drag === 'resize' &&
      (State.selected?.type === 'furniture' || State.selected?.type === 'label')) {
    const obj = State.selected.type === 'furniture'
      ? State.getFurniture(State.selected.id)
      : State.getLabel(State.selected.id);
    preDragSnap = State.snapshot();
    dragMoved = false;
    State.dragging = true;
    State.dragType = 'resize';
    State.dragStart = wp;
    State.dragOrig = { ...obj };
    return;
  }

  // Walk up DOM to find element with data-type
  const tgt = elementTarget(e.target);
  if (tgt) {
    const dataType = tgt.dataset.type;
    const dataId = parseInt(tgt.dataset.id);

    // Shift-click toggles membership without starting a move
    if (e.shiftKey) {
      State.toggleSelection(dataType, dataId);
      render();
      updatePropertiesPanel();
      return;
    }

    // Clicking an item that's part of a multi-selection moves the whole group
    if (State.selection.length > 1 && State.isSelected(dataType, dataId)) {
      startGroupMove(wp);
      return;
    }

    // Otherwise select just this item and start a single move
    State.setSelection([{ type: dataType, id: dataId }]);
    preDragSnap = State.snapshot();
    dragMoved = false;
    State.dragging = true;
    State.dragType = 'move';
    State.dragStart = wp;

    if (dataType === 'wall') State.dragOrig = { ...State.getWall(dataId) };
    else if (dataType === 'furniture') {
      State.dragOrig = { ...State.getFurniture(dataId) };
      const { sx, sy } = getSVGPoint(e);
      furnDragRaw = toWorld(sx, sy);
    }
    else if (dataType === 'opening') State.dragOrig = { ...State.getOpening(dataId) };
    else if (dataType === 'label') State.dragOrig = { ...State.getLabel(dataId) };
    else if (dataType === 'tile') { const t = State.getTileFill(dataId); State.dragOrig = { offsetX: t.offsetX || 0, offsetY: t.offsetY || 0 }; }

    render();
    updatePropertiesPanel();
    return;
  }

  // Empty canvas — begin a marquee box (becomes a deselect if it stays a click)
  marquee = { x1: wp.x, y1: wp.y, x2: wp.x, y2: wp.y };
  preDragSnap = null;
  dragMoved = false;
  State.dragging = true;
  State.dragType = 'marquee';
  State.dragStart = wp;
}

// Snap target for a dragged wall endpoint: other walls' endpoints (to connect),
// excluding the ends moving with this drag (so it can't stick to itself),
// then the inch grid.
function wallEndSnap(e) {
  const { sx, sy } = getSVGPoint(e);
  const raw = toWorld(sx, sy);
  if (!State.snapToGrid) return raw;
  const moving = new Set([
    `${State.selected.id}:${wallEndDrag.end}`,
    ...wallEndDrag.conns.map(c => `${c.id}:${c.end}`),
  ]);
  let best = null, bd = 0.5;
  for (const wo of State.walls) {
    if (!moving.has(`${wo.id}:1`)) {
      const d = dist(wo.x1, wo.y1, raw.x, raw.y);
      if (d < bd) { bd = d; best = { x: wo.x1, y: wo.y1 }; }
    }
    if (!moving.has(`${wo.id}:2`)) {
      const d = dist(wo.x2, wo.y2, raw.x, raw.y);
      if (d < bd) { bd = d; best = { x: wo.x2, y: wo.y2 }; }
    }
  }
  return best || snapToInchGrid(raw.x, raw.y);
}

// Begin moving every currently-selected object together
function startGroupMove(wp) {
  preDragSnap = State.snapshot();
  dragMoved = false;
  State.dragging = true;
  State.dragType = 'group';
  State.dragStart = wp;
  groupOrig = State.selection.map(s => ({
    type: s.type, id: s.id,
    data: JSON.parse(JSON.stringify(State.getObj(s) || {})),
  }));
}

function handleSelectDrag(e, wp) {
  // Marquee box: just track the far corner and redraw the rubber band
  if (State.dragType === 'marquee') {
    if (!marquee) return;
    marquee.x2 = wp.x; marquee.y2 = wp.y;
    drawMarquee();
    return;
  }

  // Group move: shift every selected object by the drag delta
  if (State.dragType === 'group') {
    if (!groupOrig) return;
    const dx = wp.x - State.dragStart.x;
    const dy = wp.y - State.dragStart.y;
    if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) dragMoved = true;
    for (const g of groupOrig) {
      if (g.type === 'wall') {
        const w = State.getWall(g.id); if (!w) continue;
        w.x1 = g.data.x1 + dx; w.y1 = g.data.y1 + dy;
        w.x2 = g.data.x2 + dx; w.y2 = g.data.y2 + dy;
      } else if (g.type === 'furniture') {
        const f = State.getFurniture(g.id); if (!f) continue;
        f.x = g.data.x + dx; f.y = g.data.y + dy;
      } else if (g.type === 'label') {
        const l = State.getLabel(g.id); if (!l) continue;
        l.x = g.data.x + dx; l.y = g.data.y + dy;
      }
    }
    render();
    return;
  }

  if (!State.dragStart || !State.dragOrig) return;
  const dx = wp.x - State.dragStart.x;
  const dy = wp.y - State.dragStart.y;
  if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) dragMoved = true;

  // Wall endpoint drag: move the end (and every wall end connected to it).
  if (State.dragType === 'wallend') {
    const w = State.getWall(State.selected.id);
    if (!w || !wallEndDrag) return;
    const p = wallEndSnap(e);
    const setEnd = (wall, end, x, y) => { if (end === 1) { wall.x1 = x; wall.y1 = y; } else { wall.x2 = x; wall.y2 = y; } };
    setEnd(w, wallEndDrag.end, p.x, p.y);
    for (const c of wallEndDrag.conns) {
      const wo = State.getWall(c.id);
      if (wo) setEnd(wo, c.end, p.x, p.y);
    }
    render();
    updatePropertiesPanel();
    return;
  }

  if (State.dragType === 'move') {
    if (State.selected.type === 'wall') {
      const w = State.getWall(State.selected.id);
      if (!w) return;
      w.x1 = State.dragOrig.x1 + dx;
      w.y1 = State.dragOrig.y1 + dy;
      w.x2 = State.dragOrig.x2 + dx;
      w.y2 = State.dragOrig.y2 + dy;
    } else if (State.selected.type === 'furniture') {
      const f = State.getFurniture(State.selected.id);
      if (!f) return;
      // Furniture moves by the RAW cursor delta — the cursor's corner/endpoint
      // snap would put the furniture CENTER on wall corners (burying it in the
      // wall). Instead: inch-grid the center, then nudge flush if one of the
      // furniture's corners is near an inner wall corner.
      const { sx, sy } = getSVGPoint(e);
      const raw = toWorld(sx, sy);
      const cx = State.dragOrig.x + (raw.x - (furnDragRaw?.x ?? State.dragStart.x));
      const cy = State.dragOrig.y + (raw.y - (furnDragRaw?.y ?? State.dragStart.y));
      const p = State.snapToGrid ? snapToInchGrid(cx, cy) : { x: cx, y: cy };
      f.x = p.x;
      f.y = p.y;
      if (State.snapToGrid) snapFurnitureFlush(f);
    } else if (State.selected.type === 'opening') {
      const o = State.getOpening(State.selected.id);
      if (!o) return;
      const w = State.getWall(o.wallId);
      if (!w) return;
      const r = nearestOnWall(w, wp.x, wp.y);
      const L = wallLength(w);
      const halfW = o.width / 2;
      const d1 = innerTrimAt(w, w.x1, w.y1);
      const d2 = innerTrimAt(w, w.x2, w.y2);
      const tMin = clamp((d1 + halfW) / L, 0.01, 0.99);
      const tMax = clamp((L - d2 - halfW) / L, 0.01, 0.99);
      o.t = clamp(r.t, tMin, Math.max(tMin, tMax));
    } else if (State.selected.type === 'label') {
      const lbl = State.getLabel(State.selected.id);
      if (!lbl) return;
      lbl.x = State.dragOrig.x + dx;
      lbl.y = State.dragOrig.y + dy;
    } else if (State.selected.type === 'tile') {
      const tf = State.getTileFill(State.selected.id);
      if (!tf) return;
      tf.offsetX = State.dragOrig.offsetX + dx;
      tf.offsetY = State.dragOrig.offsetY + dy;
    }
  } else if (State.dragType === 'resize' && State.selected.type === 'furniture') {
    const f = State.getFurniture(State.selected.id);
    if (!f) return;
    // Keep top-left corner fixed: shift center by half the size change
    const newW = Math.max(0.5, State.dragOrig.width  + dx);
    const newH = Math.max(0.5, State.dragOrig.height + dy);
    f.x = State.dragOrig.x + (newW - State.dragOrig.width)  / 2;
    f.y = State.dragOrig.y + (newH - State.dragOrig.height) / 2;
    f.width  = newW;
    f.height = newH;
  } else if (State.dragType === 'resize' && State.selected.type === 'label') {
    const lbl = State.getLabel(State.selected.id);
    if (!lbl) return;
    lbl.fontSize = Math.max(0.1, State.dragOrig.fontSize + dy);
  }

  render();
}

// ── Marquee selection ─────────────────────────────────────────────────────
function normRect(m) {
  return {
    x: Math.min(m.x1, m.x2), y: Math.min(m.y1, m.y2),
    w: Math.abs(m.x2 - m.x1), h: Math.abs(m.y2 - m.y1),
  };
}

function pointInBox(px, py, b) {
  return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
}

function drawMarquee() {
  const layer = document.getElementById('layer-preview');
  layer.innerHTML = '';
  if (!marquee) return;
  const r = normRect(marquee);
  const a = toScreen(r.x, r.y);
  const c = toScreen(r.x + r.w, r.y + r.h);
  layer.appendChild(makeSVGEl('rect', {
    x: a.x, y: a.y, width: c.x - a.x, height: c.y - a.y, class: 'marquee-box',
  }));
}

// Resolve the marquee into a selection (walls fully enclosed; furniture/labels by center)
function finishMarquee() {
  const box = normRect(marquee);
  marquee = null;
  document.getElementById('layer-preview').innerHTML = '';

  // A tiny box is really a click on empty space → deselect
  if (box.w < 0.1 && box.h < 0.1) { State.clearSelection(); return; }

  const sel = [];
  for (const w of State.walls) {
    if (pointInBox(w.x1, w.y1, box) && pointInBox(w.x2, w.y2, box)) {
      sel.push({ type: 'wall', id: w.id });
    }
  }
  for (const f of State.furniture) {
    if (pointInBox(f.x, f.y, box)) sel.push({ type: 'furniture', id: f.id });
  }
  for (const l of State.labels) {
    if (pointInBox(l.x, l.y, box)) sel.push({ type: 'label', id: l.id });
  }
  State.setSelection(sel);
}

// ── Clipboard ──────────────────────────────────────────────────────────────
function cloneSelection(sel) {
  const wallIds = new Set(sel.filter(s => s.type === 'wall').map(s => s.id));
  const walls = [...wallIds].map(id => State.getWall(id)).filter(Boolean);
  const openings = State.openings.filter(o => wallIds.has(o.wallId));
  const furniture = sel.filter(s => s.type === 'furniture').map(s => State.getFurniture(s.id)).filter(Boolean);
  const labels = sel.filter(s => s.type === 'label').map(s => State.getLabel(s.id)).filter(Boolean);
  return JSON.parse(JSON.stringify({ walls, openings, furniture, labels }));
}

function copySelection() {
  if (!State.selection.length) return;
  State.clipboard = cloneSelection(State.selection);
  setHint(`Copied ${State.selection.length} item(s). Ctrl/Cmd+V to paste.`);
}

function pasteClipboard() {
  const cb = State.clipboard;
  if (!cb || (!cb.walls.length && !cb.furniture.length && !cb.labels.length)) return;
  Undo.push();

  const off = 1; // paste 1 ft down-right of the source
  const idMap = {};
  const newSel = [];

  for (const w of cb.walls) {
    const nw = { ...w, id: State.newId(), x1: w.x1 + off, y1: w.y1 + off, x2: w.x2 + off, y2: w.y2 + off };
    idMap[w.id] = nw.id;
    State.walls.push(nw);
    newSel.push({ type: 'wall', id: nw.id });
  }
  for (const o of cb.openings) {
    if (idMap[o.wallId] == null) continue;
    State.openings.push({ ...o, id: State.newId(), wallId: idMap[o.wallId] });
  }
  for (const f of cb.furniture) {
    const nf = { ...f, id: State.newId(), x: f.x + off, y: f.y + off };
    State.furniture.push(nf);
    newSel.push({ type: 'furniture', id: nf.id });
  }
  for (const l of cb.labels) {
    const nl = { ...l, id: State.newId(), x: l.x + off, y: l.y + off };
    State.labels.push(nl);
    newSel.push({ type: 'label', id: nl.id });
  }

  State.setSelection(newSel);
  // Cascade: next paste offsets from what we just placed
  State.clipboard = cloneSelection(newSel);
  render();
  updatePropertiesPanel();
}

// ── Label tool ────────────────────────────────────────────────────────────
function handleLabelDown(e, wp) {
  openEditLabelModal(null, { x: wp.x, y: wp.y, text: '', fontSize: 0.75 });
}

function handleDblClickElement(type, id) {
  if (type === 'wall') openEditWallModal(id);
  else if (type === 'opening') openEditOpeningModal(id);
  else if (type === 'furniture') openEditFurnitureModal(id);
  else if (type === 'label') openEditLabelModal(id);
  else if (type === 'tile') { const tf = State.getTileFill(id); if (tf) openTileFillModal(tf.roomPoly, id); }
}

// ── Keyboard ──────────────────────────────────────────────────────────────
function onKeyDown(e) {
  const inField = e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA';

  // Space — temporary pan
  if (e.key === ' ' && !inField) {
    e.preventDefault();
    if (!spaceDown) {
      spaceDown = true;
      document.getElementById('canvas-container').style.cursor = 'grab';
    }
    return;
  }

  // Undo / Redo
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    e.preventDefault();
    Undo.undo();
    render();
    updatePropertiesPanel();
    return;
  }
  if (mod && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
    e.preventDefault();
    Undo.redo();
    render();
    updatePropertiesPanel();
    return;
  }

  if (inField) return;

  // Copy / paste the current selection
  if (mod && e.key.toLowerCase() === 'c') { e.preventDefault(); copySelection(); return; }
  if (mod && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteClipboard(); return; }

  const toolMap = { v: 'select', w: 'wall', d: 'door', n: 'window', r: 'rect', c: 'circle', l: 'label', t: 'tile', m: 'mosaic' };
  if (toolMap[e.key.toLowerCase()] && !mod) { setTool(toolMap[e.key.toLowerCase()]); return; }

  if (e.key === 'Escape') {
    cancelDraw();
    State.clearSelection();
    State.referencePoint = null;
    if (State.tileStamp) { State.tileStamp = null; setHint('Stamp cancelled.'); }
    mosaicSel = null;
    document.getElementById('layer-preview').innerHTML = '';
    render();
    updatePropertiesPanel();
    updateReferenceReadout();
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (State.selection.length) { Undo.push(); State.deleteSelected(); render(); updatePropertiesPanel(); }
  }
  if (e.key === '+' || e.key === '=') zoomBy(1.2);
  if (e.key === '-') zoomBy(1 / 1.2);
  if (e.key === 'f' || e.key === 'F') zoomFit();
  if ((e.key === 'Enter') && State.tool === 'wall' && State.drawing) finishWallChain();
}

function onKeyUp(e) {
  if (e.key === ' ') {
    spaceDown = false;
    if (!panStart) {
      document.getElementById('canvas-container').style.cursor = '';
    }
  }
}

// ── Zoom helpers ──────────────────────────────────────────────────────────
function zoomBy(factor) {
  const cvs = document.getElementById('canvas');
  const cx = cvs.clientWidth / 2, cy = cvs.clientHeight / 2;
  const wb = toWorld(cx, cy);
  State.scale = clamp(State.scale * factor, 10, 200);
  const wa = toWorld(cx, cy);
  State.panX += (wa.x - wb.x) * State.scale;
  State.panY += (wa.y - wb.y) * State.scale;
  updateZoomLabel();
  render();
}

function zoomFit() {
  const pts = [];
  for (const w of State.walls) pts.push([w.x1, w.y1], [w.x2, w.y2]);
  for (const f of State.furniture) {
    const hw = f.width / 2, hh = f.height / 2;
    pts.push([f.x - hw, f.y - hh], [f.x + hw, f.y + hh]);
  }
  if (!pts.length) return;

  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const W = maxX - minX || 10, H = maxY - minY || 10;

  const cvs = document.getElementById('canvas');
  const mg = 80;
  State.scale = clamp(Math.min((cvs.clientWidth - mg * 2) / W, (cvs.clientHeight - mg * 2) / H), 10, 200);
  State.panX = mg - minX * State.scale;
  State.panY = mg - minY * State.scale;
  updateZoomLabel();
  render();
}

function calcInjectStyles() {

// ── Unit-aware evaluation over a token list ─────────────────────────────────
// tokens: {t:'qty', v, dim} | {t:'+'|'-'|'*'|'/'|'('|')'}
function calcDimName(d) {
  return ['a number', 'a length', 'an area', 'a volume'][d] || 'that';
}

function calcEvalTokens(tokens) {
  if (!tokens.length) throw new Error('Nothing to calculate');
  let p = 0;
  const peek = () => tokens[p];
  const take = () => tokens[p++];

  function expr() {
    let a = term();
    while (peek() && (peek().t === '+' || peek().t === '-')) {
      const op = take().t, b = term();
      if (a.dim !== b.dim) throw new Error(`Can't ${op === '+' ? 'add' : 'subtract'} ${calcDimName(b.dim)} ${op === '+' ? 'to' : 'from'} ${calcDimName(a.dim)}`);
      a = { v: op === '+' ? a.v + b.v : a.v - b.v, dim: a.dim };
    }
    return a;
  }
  function term() {
    let a = unary();
    while (peek() && (peek().t === '*' || peek().t === '/')) {
      const op = take().t, b = unary();
      if (op === '*') {
        const dim = a.dim + b.dim;
        if (dim > 3) throw new Error('Beyond volume — too many lengths multiplied');
        a = { v: a.v * b.v, dim };
      } else {
        if (b.v === 0) throw new Error('Divide by zero');
        const dim = a.dim - b.dim;
        if (dim < 0) throw new Error(`Can't divide ${calcDimName(a.dim)} by ${calcDimName(b.dim)}`);
        a = { v: a.v / b.v, dim };
      }
    }
    return a;
  }
  function unary() {
    if (peek() && peek().t === '-') { take(); const a = unary(); return { v: -a.v, dim: a.dim }; }
    return primary();
  }
  function primary() {
    const t = take();
    if (!t) throw new Error('Expression is incomplete');
    if (t.t === '(') {
      const a = expr();
      const c = take();
      if (!c || c.t !== ')') throw new Error('Missing )');
      return a;
    }
    if (t.t === 'qty') return { v: t.v, dim: t.dim };
    throw new Error(`Unexpected "${t.t}"`);
  }

  const r = expr();
  if (p < tokens.length) throw new Error('Malformed expression');
  return r;
}

// String form kept for tests / power users; the UI builds tokens directly.
function calcTokenize(str) {
  const s = str.replace(/[×✕]/g, '*').replace(/÷/g, '/').replace(/[’′]/g, "'").replace(/[”″]/g, '"');
  const tokens = [];
  let i = 0;
  const R_FT = /^(\d+(?:\.\d+)?)\s*'\s*(?:(?:(\d+)\s+)?(\d+)\/(\d+)\s*"|(\d+(?:\.\d+)?)\s*")?/;
  const R_IN_FRAC = /^(?:(\d+)\s+)?(\d+)\/(\d+)\s*"/;
  const R_IN_DEC  = /^(\d+(?:\.\d+)?)\s*"/;
  const R_NUM     = /^(\d+(?:\.\d+)?)/;
  while (i < s.length) {
    const rest = s.slice(i);
    const ws = /^\s+/.exec(rest);
    if (ws) { i += ws[0].length; continue; }
    let m;
    if ((m = R_FT.exec(rest))) {
      let inches = parseFloat(m[1]) * 12;
      if (m[3]) inches += (m[2] ? parseInt(m[2], 10) : 0) + parseInt(m[3], 10) / parseInt(m[4], 10);
      else if (m[5] != null) inches += parseFloat(m[5]);
      tokens.push({ t: 'qty', v: inches, dim: 1 }); i += m[0].length; continue;
    }
    if ((m = R_IN_FRAC.exec(rest))) {
      tokens.push({ t: 'qty', v: (m[1] ? parseInt(m[1], 10) : 0) + parseInt(m[2], 10) / parseInt(m[3], 10), dim: 1 });
      i += m[0].length; continue;
    }
    if ((m = R_IN_DEC.exec(rest))) { tokens.push({ t: 'qty', v: parseFloat(m[1]), dim: 1 }); i += m[0].length; continue; }
    if ((m = R_NUM.exec(rest)))    { tokens.push({ t: 'qty', v: parseFloat(m[1]), dim: 0 }); i += m[0].length; continue; }
    const c = s[i];
    if ('+-*/()'.includes(c)) { tokens.push({ t: c }); i++; continue; }
    throw new Error(`Unexpected "${c}"`);
  }
  return tokens;
}

function calcEvaluate(str) { return calcEvalTokens(calcTokenize(str)); }

// ── Formatting ──────────────────────────────────────────────────────────────
function calcNum(x, dp = 4) {
  return String(parseFloat(x.toFixed(dp)));
}

function calcFrac16(inches) {
  const sign = inches < 0 ? '-' : '';
  const total = Math.abs(inches) * 16;
  const r = Math.round(total);
  const exact = Math.abs(total - r) < 1e-6;
  let whole = Math.floor(r / 16), num = r % 16, den = 16;
  while (num && num % 2 === 0) { num /= 2; den /= 2; }
  return { sign, whole, num, den, exact };
}

function calcFmtInFrac(inches) {
  const f = calcFrac16(inches);
  const frac = f.num ? (f.whole ? `${f.whole} ${f.num}/${f.den}` : `${f.num}/${f.den}`) : `${f.whole}`;
  return `${f.exact ? '' : '≈ '}${f.sign}${frac}"`;
}

function calcFmtFtIn(inches) {
  const f = calcFrac16(inches);
  const ft = Math.floor(f.whole / 12);
  const inWhole = f.whole % 12;
  const pre = f.exact ? '' : '≈ ';
  const fracStr = f.num ? `${f.num}/${f.den}` : '';
  if (!ft) {
    if (f.num) return `${pre}${f.sign}${inWhole ? inWhole + ' ' : ''}${fracStr}"`;
    return `${pre}${f.sign}${inWhole}"`;
  }
  let inPart = '';
  if (inWhole && f.num) inPart = ` ${inWhole} ${fracStr}"`;
  else if (inWhole) inPart = ` ${inWhole}"`;
  else if (f.num) inPart = ` ${fracStr}"`;
  return `${pre}${f.sign}${ft}'${inPart}`;
}

function calcPrimary(val) {
  if (val.dim === 0) return calcNum(val.v, 6);
  if (val.dim === 1) return calcFmtFtIn(val.v);
  if (val.dim === 2) return `${calcNum(val.v / 144, 3)} sq ft`;
  return `${calcNum(val.v / 1728, 3)} cu ft`;
}

// Representation list for a value; each row carries the numeric value it shows
// (fraction rows are the rounded-to-1/16 value) so a click can continue with it.
function calcReps(val) {
  if (val.dim === 1) {
    const v16 = Math.round(val.v * 16) / 16;
    return [
      { lbl: 'feet & inches', val: calcFmtFtIn(val.v), v: v16, dim: 1 },
      { lbl: 'inches (fraction)', val: calcFmtInFrac(val.v), v: v16, dim: 1 },
      { lbl: 'inches (decimal)', val: `${calcNum(val.v)}"`, v: val.v, dim: 1 },
      { lbl: 'feet (decimal)', val: `${calcNum(val.v / 12)}'`, v: val.v, dim: 1 },
    ];
  }
  if (val.dim === 2) {
    return [
      { lbl: 'square feet', val: `${calcNum(val.v / 144, 3)} sq ft`, v: val.v, dim: 2 },
      { lbl: 'square inches', val: `${calcNum(val.v, 2)} sq in`, v: val.v, dim: 2 },
      { lbl: 'square yards', val: `${calcNum(val.v / 1296, 3)} sq yd`, v: val.v, dim: 2 },
    ];
  }
  if (val.dim === 3) {
    return [
      { lbl: 'cubic feet', val: `${calcNum(val.v / 1728, 3)} cu ft`, v: val.v, dim: 3 },
      { lbl: 'cubic inches', val: `${calcNum(val.v, 1)} cu in`, v: val.v, dim: 3 },
    ];
  }
  return [{ lbl: 'number', val: calcNum(val.v, 6), v: val.v, dim: 0 }];
}

// ── UI ──────────────────────────────────────────────────────────────────────
function initCalculator(root, opts = {}) {

  const freshEntry = () => ({ digits: '', feet: null, inches: null, frac: null });
  let entry = freshEntry();

  const chips = document.createElement('div');

  [[1, 16], [1, 8], [3, 16], [1, 4], [5, 16], [3, 8], [7, 16], [1, 2], [9, 16], [5, 8], [11, 16], [3, 4], [13, 16], [7, 8], [15, 16]]

  body.appendChild(chips);

  // Keypad

  pad.className = 'fpcalc-pad';
  const keys = [
    ['C', 'op', () => { tokens = []; entry = freshEntry(); resultVal = null; lastExpr = ''; justEvaluated = false; errMsg = null; update(); }],
    ['(', 'op', () => pressParen('(')],
    [')', 'op', () => pressParen(')')],
    ['⌫', 'op', pressBack],
    ['7', '', () => pressDigit('7')], ['8', '', () => pressDigit('8')], ['9', '', () => pressDigit('9')], ['÷', 'op', () => pressOp('/')],
    ['4', '', () => pressDigit('4')], ['5', '', () => pressDigit('5')], ['6', '', () => pressDigit('6')], ['×', 'op', () => pressOp('*')],
    ['1', '', () => pressDigit('1')], ['2', '', () => pressDigit('2')], ['3', '', () => pressDigit('3')], ['−', 'op', () => pressOp('-')],
    ['0', '', () => pressDigit('0')], ['.', '', () => pressDigit('.')], ['ft', 'unit', pressFt], ['+', 'op', () => pressOp('+')],
    ['in', 'unit', pressIn], ['=', 'eq', pressEq],
  ];
  for (const [label, cls, fn] of keys) {
    const k = document.createElement('button');
    k.className = 'fpcalc-key' + (cls ? ' ' + cls : '');
    k.textContent = label;
    k.addEventListener('click', () => { fn(); root.focus(); });
    pad.appendChild(k);
  }
  body.appendChild(pad);

  const hist = document.createElement('div');
  hist.className = 'fpcalc-hist';
  body.appendChild(hist);

  // ── Entry model ───────────────────────────────────────────────────────────
  const entryIsLen = () => entry.feet != null || entry.inches != null || entry.frac != null;

  function entryValue() {
    if (entryIsLen()) {
      const extraIn = entry.digits ? parseFloat(entry.digits) : 0;   // digits after [ft] are inches
      const v = (entry.feet ?? 0) * 12 + (entry.inches ?? 0) + extraIn
        + (entry.frac ? entry.frac.n / entry.frac.d : 0);
      return { v, dim: 1 };
    }
    if (entry.digits) return { v: parseFloat(entry.digits), dim: 0 };
    return null;
  }

  function entryDisplay() {
    if (!entryIsLen()) return entry.digits;
    let s = entry.feet != null ? `${entry.feet}'` : '';
    const inch = entry.inches != null ? entry.inches : (entry.digits !== '' ? entry.digits : null);
    const fr = entry.frac ? `${entry.frac.n}/${entry.frac.d}` : '';
    if (inch != null && fr) s += ` ${inch} ${fr}"`;
    else if (inch != null) s += entry.inches != null ? ` ${inch}"` : ` ${inch}`; // bare while typing
    else if (fr) s += ` ${fr}"`;
    return s.trim();
  }

  // ── Key behaviors ─────────────────────────────────────────────────────────
  function startFreshIfNeeded() {
    // Typing right after '=' starts a new calculation
    if (justEvaluated) { resultVal = null; lastExpr = ''; justEvaluated = false; }
    errMsg = null;
  }

  function pressDigit(d) {
    startFreshIfNeeded();
    if (entry.inches != null || entry.frac) return;   // value complete — press an operator
    if (d === '.' && entry.digits.includes('.')) return;
    entry.digits += d;
    update();
  }

  function pressFt() {
    startFreshIfNeeded();
    if (!entry.digits || entry.feet != null || entry.inches != null || entry.frac) return;
    entry.feet = parseFloat(entry.digits);
    entry.digits = '';
    update();
  }

  function pressIn() {
    startFreshIfNeeded();
    if (!entry.digits || entry.inches != null || entry.frac) return;
    entry.inches = parseFloat(entry.digits);
    entry.digits = '';
    update();
  }

  function pressChip(n, d) {
    startFreshIfNeeded();
    if (entry.digits) { entry.inches = parseFloat(entry.digits); entry.digits = ''; } // 3 + chip → 3 1/2"
    entry.frac = { n, d };
    update();
  }

  function pressOp(op) {
    errMsg = null;
    const v = entryValue();
    if (v) { tokens.push({ t: 'qty', ...v }); entry = freshEntry(); }
    else if (!tokens.length && resultVal) { tokens.push({ t: 'qty', ...resultVal }); } // continue from result
    justEvaluated = false;
    const last = tokens[tokens.length - 1];
    if (!last || last.t === '(') return update();       // leading minus etc. not supported — ignore
    if ('+-*/'.includes(last.t)) tokens[tokens.length - 1] = { t: op }; // change your mind
    else tokens.push({ t: op });
    update();
  }

  function pressParen(p) {
    errMsg = null;
    justEvaluated = false;
    if (p === '(') {
      if (entryValue()) return;   // needs an operator first
      tokens.push({ t: '(' });
    } else {
      const v = entryValue();
      if (v) { tokens.push({ t: 'qty', ...v }); entry = freshEntry(); }
      tokens.push({ t: ')' });
    }
    update();
  }

  function pressBack() {
    errMsg = null;
    justEvaluated = false;
    if (entry.digits) entry.digits = entry.digits.slice(0, -1);
    else if (entry.frac) entry.frac = null;
    else if (entry.inches != null) { entry.digits = String(entry.inches); entry.inches = null; }
    else if (entry.feet != null) { entry.digits = String(entry.feet); entry.feet = null; }
    else if (tokens.length) tokens.pop();
    update();
  }

  function pressEq() {
    errMsg = null;
    const v = entryValue();
    if (v) { tokens.push({ t: 'qty', ...v }); entry = freshEntry(); }
    if (!tokens.length) return;
    if ('+-*/'.includes(tokens[tokens.length - 1].t)) tokens.pop();  // trailing operator
    try {
      const r = calcEvalTokens(tokens);
      lastExpr = tokensDisplay(tokens);
      resultVal = r;
      justEvaluated = true;
      history.unshift({ expr: lastExpr, disp: calcPrimary(r), v: r.v, dim: r.dim });
      history = history.slice(0, 30);
      try { localStorage.setItem('fpcalc_history', JSON.stringify(history)); } catch (_) {}
      tokens = [];
      renderHistory();
    } catch (err) {
      errMsg = err.message;
    }
    update();
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  const OP_GLYPH = { '*': '×', '/': '÷', '+': '+', '-': '−', '(': '(', ')': ')' };
  function tokensDisplay(tks) {
    return tks.map(t => t.t === 'qty' ? calcPrimary({ v: t.v, dim: t.dim }) : OP_GLYPH[t.t]).join(' ');
  }

  function update() {
    reps.hidden = true;
    if (errMsg) {
      exprLine.textContent = tokensDisplay(tokens);
      display.className = 'fpcalc-display err';
      display.textContent = errMsg;
      return;
    }
    if (justEvaluated && resultVal) {
      exprLine.textContent = lastExpr + ' =';
      display.className = 'fpcalc-display res';
      display.title = 'Click for other representations';
      display.textContent = calcPrimary(resultVal);
      return;
    }
    exprLine.textContent = tokensDisplay(tokens);
    display.className = 'fpcalc-display';
    display.title = '';
    display.textContent = entryDisplay() || '0';
  }

  // Click the result → all representations; click a row to continue with it
  display.addEventListener('click', () => {
    if (!(justEvaluated && resultVal)) return;
    if (!reps.hidden) { reps.hidden = true; return; }
    reps.innerHTML = '';
    for (const r of calcReps(resultVal)) {
      const row = document.createElement('div');
      row.className = 'fpcalc-rep';
      row.title = 'Click to continue with this value';
      row.innerHTML = `<span class="lbl">${r.lbl}</span><span class="val">${r.val}</span>`;
      row.addEventListener('click', e => {
        e.stopPropagation();
        resultVal = { v: r.v, dim: r.dim };
        justEvaluated = true;
        update();
      });
      reps.appendChild(row);
    }
    reps.hidden = false;
  });

  function renderHistory() {
    hist.innerHTML = '';
    if (!history.length) return;
    const hh = document.createElement('div');
    hh.className = 'fpcalc-hist-head';
    hh.innerHTML = '<span>History</span>';
    const clr = document.createElement('button');
    clr.className = 'fpcalc-hist-clear';
    clr.textContent = 'clear';
    clr.addEventListener('click', () => {
      history = [];
      try { localStorage.removeItem('fpcalc_history'); } catch (_) {}
      renderHistory();
    });
    hh.appendChild(clr);
    hist.appendChild(hh);
    for (const h of history) {
      const it = document.createElement('div');
      it.className = 'fpcalc-hist-item';
      it.title = 'Click to continue with this result';
      it.innerHTML = `<span class="he">${h.expr}</span><span class="hr">${h.disp}</span>`;
      it.addEventListener('click', () => {
        if (h.v == null) return;
        tokens = []; entry = freshEntry();
        resultVal = { v: h.v, dim: h.dim || 0 };
        lastExpr = h.expr;
        justEvaluated = true;
        errMsg = null;
        update();
        root.focus();
      });
      hist.appendChild(it);
    }
  }

  // Keyboard: digits, ops, Enter, Backspace, f/' = ft, i/" = in
  root.addEventListener('keydown', e => {
    e.stopPropagation();
    const k = e.key;
    if (/^[0-9.]$/.test(k)) pressDigit(k);
    else if (k === '+') pressOp('+');
    else if (k === '-') pressOp('-');
    else if (k === '*' || k.toLowerCase() === 'x') pressOp('*');
    else if (k === '/') pressOp('/');
    else if (k === 'Enter' || k === '=') { e.preventDefault(); pressEq(); }
    else if (k === 'Backspace') { e.preventDefault(); pressBack(); }
    else if (k === "'" || k.toLowerCase() === 'f') pressFt();
    else if (k === '"' || k.toLowerCase() === 'i') pressIn();
    else if (k === '(' || k === ')') pressParen(k);
    else if (k === 'Escape') reps.hidden = true;
  });
  root.addEventListener('pointerdown', () => root.focus());

  // Dragging (floating mode)
  if (floating) {
    let drag = null;
    try {
      const pos = JSON.parse(localStorage.getItem('fpcalc_pos') || 'null');
      if (pos) { root.style.left = pos.left + 'px'; root.style.top = pos.top + 'px'; }
      else { root.style.right = '20px'; root.style.top = '60px'; }
    } catch (_) { root.style.right = '20px'; root.style.top = '60px'; }
    head.addEventListener('pointerdown', e => {
      if (e.target.classList.contains('fpcalc-close')) return;
      const r = root.getBoundingClientRect();
      drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
      root.style.right = '';
      head.setPointerCapture(e.pointerId);
    });
    head.addEventListener('pointermove', e => {
      if (!drag) return;
      const left = Math.max(0, Math.min(window.innerWidth - 80, e.clientX - drag.dx));
      const top = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - drag.dy));
      root.style.left = left + 'px';
      root.style.top = top + 'px';
    });
    head.addEventListener('pointerup', () => {
      if (!drag) return;
      drag = null;
      try {
        localStorage.setItem('fpcalc_pos', JSON.stringify({ left: parseInt(root.style.left) || 0, top: parseInt(root.style.top) || 0 }));
      } catch (_) {}
    });
  }

  renderHistory();
  update();
  return { focus: () => root.focus() };
}

// Floating window used by the floor-plan toolbar
let _calcWin = null;
function toggleCalcWindow() {
  if (_calcWin) {
    _calcWin.style.display = _calcWin.style.display === 'none' ? '' : 'none';
    return;
  }
  _calcWin = document.createElement('div');
  document.body.appendChild(_calcWin);
  initCalculator(_calcWin, { floating: true, onClose: () => { _calcWin.style.display = 'none'; } });
}
