<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floor Plan Designer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #eee;
  height: 100vh;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── Toolbar ── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 6px 12px;
  background: #16213e;
  border-bottom: 2px solid #0f3460;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.app-title {
  font-weight: 700;
  font-size: 15px;
  color: #e94560;
  letter-spacing: 0.5px;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 4px;
}

.tool-btn {
  width: 34px;
  height: 34px;
  border: 1px solid #0f3460;
  border-radius: 6px;
  background: #1a1a2e;
  color: #aac;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.tool-btn:hover { background: #0f3460; color: #fff; }
.tool-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

.icon-btn {
  padding: 5px 10px;
  border: 1px solid #0f3460;
  border-radius: 6px;
  background: #1a1a2e;
  color: #aac;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.icon-btn:hover { background: #0f3460; color: #fff; }
.icon-btn.accent { background: #0f3460; border-color: #e94560; color: #e94560; }
.icon-btn.accent:hover { background: #e94560; color: #fff; }

#zoom-label {
  font-size: 12px;
  color: #88a;
  min-width: 38px;
  text-align: center;
}

.toggle-label {
  font-size: 12px;
  color: #99b;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 4px;
}

.toggle-label input { cursor: pointer; accent-color: #e94560; }

/* ── Workspace ── */
#workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

#canvas-container {
  flex: 1;
  background: #f0ede8;
  overflow: hidden;
  position: relative;
  cursor: crosshair;
}

#canvas-container.tool-select { cursor: default; }
#canvas-container.tool-wall { cursor: crosshair; }
#canvas-container.tool-door { cursor: cell; }
#canvas-container.tool-window { cursor: cell; }
#canvas-container.tool-rect { cursor: cell; }
#canvas-container.tool-circle { cursor: cell; }
#canvas-container.tool-tile { cursor: cell; }
#canvas-container.tool-mosaic { cursor: pointer; }
#canvas-container.panning { cursor: grabbing; }

/* ── Tile fills ── */
.tile-cell { stroke: rgba(0, 0, 0, 0.12); stroke-width: 0.5; }
#canvas-container.tool-mosaic .tile-cell { cursor: pointer; }

.tile-stats {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #0f3460;
  font-size: 12px;
}
.tile-stats .stat-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 0;
  color: #aac;
}
.tile-stats .stat-row span:last-child { color: #fff; font-variant-numeric: tabular-nums; }
.tile-stats .stat-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #7788aa;
  margin-bottom: 4px;
}
.info-btn {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 1px solid #557;
  background: #0f3460;
  color: #cdd;
  font-size: 10px;
  font-style: italic;
  font-family: Georgia, 'Times New Roman', serif;
  line-height: 1;
  cursor: pointer;
  padding: 0;
}
.info-btn:hover { background: #e94560; border-color: #e94560; color: #fff; }
.tile-stats-help {
  margin-bottom: 6px;
  padding: 6px 8px;
  background: #0f1d3a;
  border: 1px solid #0f3460;
  border-radius: 4px;
  font-size: 11px;
  line-height: 1.45;
  color: #aab8d0;
  text-transform: none;
  letter-spacing: 0;
}
.stat-swatch {
  display: inline-block;
  width: 9px; height: 9px;
  margin-right: 5px;
  border: 1px solid #557;
  vertical-align: middle;
}

#canvas {
  width: 100%;
  height: 100%;
  display: block;
  user-select: none;
}

/* ── Properties Panel ── */
#properties-panel {
  width: 220px;
  background: #16213e;
  border-left: 2px solid #0f3460;
  padding: 12px;
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#properties-panel.hidden { display: none; }

#prop-title {
  font-size: 13px;
  font-weight: 600;
  color: #e94560;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding-bottom: 8px;
  border-bottom: 1px solid #0f3460;
}

#prop-content {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.prop-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.prop-row label {
  font-size: 11px;
  color: #88a;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.prop-row input, .prop-row select {
  background: #1a1a2e;
  border: 1px solid #0f3460;
  border-radius: 4px;
  color: #eee;
  font-size: 13px;
  padding: 5px 7px;
  width: 100%;
  outline: none;
}

.prop-row input:focus, .prop-row select:focus { border-color: #e94560; }

.prop-actions { margin-top: auto; }

.danger-btn {
  width: 100%;
  padding: 7px;
  background: transparent;
  border: 1px solid #e94560;
  border-radius: 5px;
  color: #e94560;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

.danger-btn:hover { background: #e94560; color: #fff; }

/* ── Status Bar ── */
#statusbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 4px 12px;
  background: #16213e;
  border-top: 1px solid #0f3460;
  font-size: 11px;
  color: #77a;
  flex-shrink: 0;
}

#status-ref { color: #2aa198; font-weight: 600; }
#status-ref.active { cursor: pointer; }
#status-ref.active:hover { color: #3fd0c4; }

#status-hint { color: #557; margin-left: auto; font-style: italic; }

/* ── SVG elements ── */
.wall-line {
  stroke: #2c2c2c;
  stroke-linecap: butt;
}

.wall-fill {
  fill: #4a4a4a;
}

.opening-gap {
  stroke: #f0ede8;
  stroke-linecap: butt;
}

.door-arc {
  fill: none;
  stroke: #7a5c3a;
  stroke-width: 1.5;
  stroke-dasharray: 4,3;
}

.door-panel {
  stroke: #7a5c3a;
  stroke-width: 2;
  fill: none;
}

.window-fill {
  fill: none;
}

.window-glass {
  stroke: #4169e1;
  stroke-width: 1.5;
}

.dim-line {
  stroke: #0055bb;
  stroke-width: 1;
  fill: none;
  marker-start: url(#arr-start);
  marker-end: url(#arr-end);
}

.dim-ext {
  stroke: #0055bb;
  stroke-width: 0.75;
  stroke-dasharray: 2,2;
  fill: none;
}

.dim-text {
  fill: #0044aa;
  font-size: 11px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

.dim-text-bg {
  fill: #f0ede8;
  stroke: none;
}

.dim-line-ctr {
  stroke: #8899bb;
  stroke-width: 0.75;
  fill: none;
  marker-start: url(#arr-start-gray);
  marker-end: url(#arr-end-gray);
}

.dim-ext-ctr {
  stroke: #aabbd0;
  stroke-width: 0.5;
  stroke-dasharray: 2,2;
  fill: none;
}

.dim-text-ctr {
  fill: #6677aa;
  font-size: 9px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

.dim-label-inner {
  fill: #004499;
  font-size: 9px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 600;
  pointer-events: none;
}

.angle-arc {
  fill: none;
  stroke: #aa6600;
  stroke-width: 1;
}

.angle-text {
  fill: #884400;
  font-size: 10px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

.furn-rect {
  stroke: #2d7a3a;
  stroke-width: 1.5;
  fill: rgba(144, 238, 144, 0.35);
  cursor: move;
}

.furn-circle {
  stroke: #2d7a3a;
  stroke-width: 1.5;
  fill: rgba(144, 238, 144, 0.35);
  cursor: move;
}

.label-text {
  fill: #222;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

.furn-label {
  fill: #1a4a22;
  font-size: 10px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

.handle {
  fill: #ff6600;
  stroke: #fff;
  stroke-width: 1;
  cursor: nwse-resize;
}

.selection-box {
  fill: none;
  stroke: #ff6600;
  stroke-width: 1.5;
  stroke-dasharray: 5,3;
  pointer-events: none;
}

.preview-wall {
  stroke: #e94560;
  stroke-width: 2;
  stroke-dasharray: 6,4;
  fill: none;
  pointer-events: none;
}

.preview-dim {
  fill: #c43050;
  font-size: 11px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

.snap-indicator {
  fill: none;
  stroke: #ff6600;
  stroke-width: 1.5;
  pointer-events: none;
}

.snap-tick {
  stroke: #ff6600;
  stroke-width: 2.5;
  pointer-events: none;
}
.snap-center-dot {
  fill: #ff6600;
  stroke: #fff;
  stroke-width: 1;
  pointer-events: none;
}

.marquee-box {
  fill: rgba(233,69,96,0.10);
  stroke: #e94560;
  stroke-width: 1;
  stroke-dasharray: 4,3;
  pointer-events: none;
}

.ref-line {
  stroke: #2aa198;
  stroke-width: 1.25;
  stroke-dasharray: 5,4;
  pointer-events: none;
}

.ref-marker {
  fill: rgba(42,161,152,0.18);
  stroke: #2aa198;
  stroke-width: 1.5;
  pointer-events: none;
}

.ref-cross {
  stroke: #2aa198;
  stroke-width: 1.5;
  pointer-events: none;
}

.ref-text {
  fill: #1a7a72;
  font-size: 12px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

/* ── Modal ── */
#modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

#modal-overlay.hidden { display: none; }

#modal {
  background: #16213e;
  border: 2px solid #0f3460;
  border-radius: 10px;
  padding: 24px;
  min-width: 300px;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

#modal-title {
  font-size: 15px;
  color: #e94560;
  font-weight: 600;
}

#modal-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: #ccc;
  font-size: 13px;
}

.modal-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.modal-field label {
  font-size: 11px;
  color: #88a;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.modal-field input, .modal-field select {
  background: #1a1a2e;
  border: 1px solid #0f3460;
  border-radius: 4px;
  color: #eee;
  font-size: 13px;
  padding: 6px 8px;
  outline: none;
}

.modal-field input:focus { border-color: #e94560; }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.modal-actions button {
  padding: 7px 18px;
  border-radius: 5px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.15s;
}

#modal-ok {
  background: #e94560;
  border-color: #e94560;
  color: #fff;
}

#modal-ok:hover { background: #c73050; }

#modal-cancel {
  background: transparent;
  border-color: #0f3460;
  color: #88a;
}

#modal-cancel:hover { background: #0f3460; color: #eee; }

/* scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1a1a2e; }
::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="toolbar-group">
      <span class="app-title">Floor Plan</span>
    </div>
    <div class="toolbar-group" id="tool-buttons">
      <button class="tool-btn active" data-tool="select" title="Select (V)">&#128433;&#65039;</button>
      <button class="tool-btn" data-tool="wall" title="Draw Wall (W)">&#129521;</button>
      <button class="tool-btn" data-tool="door" title="Place Door (D)">🚪</button>
      <button class="tool-btn" data-tool="window" title="Place Window (N)">🪟</button>
      <button class="tool-btn" data-tool="rect" title="Place Furniture Box (R)">&#9645;</button>
      <button class="tool-btn" data-tool="circle" title="Place Furniture Circle (C)">&#9711;</button>
      <button class="tool-btn" data-tool="label" title="Add Text Label (L)" style="font-weight:700;font-size:14px">T</button>
      <button class="tool-btn" data-tool="tile" title="Lay Tile in Room (T)">&#11042;</button>
      <button class="tool-btn" data-tool="mosaic" title="Mosaic Designer — paint tiles (M)">&#127912;</button>
    </div>
    <div class="toolbar-group" id="view-controls">
      <button class="icon-btn" id="btn-zoom-in" title="Zoom In (+)">+</button>
      <span id="zoom-label">100%</span>
      <button class="icon-btn" id="btn-zoom-out" title="Zoom Out (-)">−</button>
      <button class="icon-btn" id="btn-zoom-fit" title="Fit View (F)">&#9974;</button>
      <label class="toggle-label"><input type="checkbox" id="chk-grid" checked> Grid</label>
      <label class="toggle-label"><input type="checkbox" id="chk-dims" checked> Dims</label>
      <label class="toggle-label"><input type="checkbox" id="chk-snap" checked> Snap</label>
      <label class="toggle-label" title="Wall lengths entered as inner clear (room size). Wall will be placed longer to account for connecting walls."><input type="checkbox" id="chk-interior" checked> Interior</label>
    </div>
    <div class="toolbar-group" id="file-controls">
      <button class="icon-btn" id="btn-calc" title="Feet &amp; Inches Calculator">&#129518; Calc</button>
      <button class="icon-btn" id="btn-settings" title="Settings">&#9881; Settings</button>
      <button class="icon-btn" id="btn-save" title="Save Project (overwrites the chosen file)">&#128190; Save</button>
      <button class="icon-btn" id="btn-save-as" title="Save to a new file">Save As</button>
      <button class="icon-btn" id="btn-load" title="Open Project">&#128193; Open</button>
      <button class="icon-btn accent" id="btn-export" title="Export Floor Plan">&#8659; Export PNG</button>
    </div>
  </header>

  <div id="workspace">
    <div id="canvas-container">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- refX = arrow tip, so the tip lands exactly on the line end (never pokes into walls) -->
          <marker id="arr-end" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#0055bb"/>
          </marker>
          <marker id="arr-start" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto-start-reverse">
            <path d="M0,0 L6,3 L0,6 Z" fill="#0055bb"/>
          </marker>
          <marker id="arr-end-gray" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto">
            <path d="M0,0 L5,2.5 L0,5 Z" fill="#8899bb"/>
          </marker>
          <marker id="arr-start-gray" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto-start-reverse">
            <path d="M0,0 L5,2.5 L0,5 Z" fill="#8899bb"/>
          </marker>
          <pattern id="grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#ddd" stroke-width="0.5"/>
          </pattern>
          <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#grid-minor)"/>
            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#bbb" stroke-width="1"/>
          </pattern>
        </defs>
        <g id="layer-bg">
          <rect id="grid-rect" x="-5000" y="-5000" width="10000" height="10000" fill="url(#grid-major)"/>
        </g>
        <g id="layer-tiles"></g>
        <g id="layer-walls"></g>
        <g id="layer-openings"></g>
        <g id="layer-furniture"></g>
        <g id="layer-labels"></g>
        <g id="layer-dimensions"></g>
        <g id="layer-angles"></g>
        <g id="layer-reference"></g>
        <g id="layer-preview"></g>
        <g id="layer-selection"></g>
      </svg>
    </div>

    <aside id="properties-panel" class="hidden">
      <h3 id="prop-title">Properties</h3>
      <div id="prop-content"></div>
      <div class="prop-actions">
        <button id="btn-delete-sel" class="danger-btn">Delete</button>
      </div>
    </aside>
  </div>

  <div id="statusbar">
    <span id="status-tool">Tool: Select</span>
    <span id="status-coords">0' 0", 0' 0"</span>
    <span id="status-ref"></span>
    <span id="status-hint">Click elements to select. Click and drag to move.</span>
  </div>
</div>

<div id="modal-overlay" class="hidden">
  <div id="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-ok">OK</button>
      <button id="modal-cancel">Cancel</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".fpd" style="display:none">
<script>
// ===== state.js =====
'use strict';

const State = {
  tool: 'select',

  walls: [],      // {id, x1,y1,x2,y2, thickness}
  openings: [],   // {id, type:'door'|'window', wallId, t, width, swing:'left'|'right', label}
  furniture: [],  // {id, type:'rect'|'circle', x,y, width,height, rotation, label, color?, noFloor?}
  labels: [],     // {id, x,y, text, fontSize}
  tilefills: [],  // {id, roomPoly:[{x,y}], shape:'square'|'hex', tileW,tileH, grout, offsetX,offsetY, baseColor,accentColor, painted:{"c,r":1}}

  selected: null,    // {type, id} — the single selection (null when 0 or many)
  selection: [],     // array of {type, id} — full selection (marquee / multi)
  clipboard: null,   // {walls, openings, furniture, labels} deep-cloned for paste

  // Canvas pan/zoom
  panX: 80,
  panY: 80,
  scale: 40,       // px per foot

  // Drawing state
  drawing: false,
  drawStart: null,
  chainEnd: null,   // last point for wall chaining
  mouseWorld: { x: 0, y: 0 },
  rawMouseWorld: { x: 0, y: 0 }, // unsnapped cursor — used by the measuring tool
  referencePoint: null, // {x,y} measurement origin set by right-click

  // Dragging state
  dragging: false,
  dragType: null,   // 'move'|'resize'
  dragStart: null,
  dragOrig: null,

  // Settings
  snapToGrid: true,
  gridFeet: 0.5,
  showGrid: true,
  showDimensions: true,
  interiorMode: true,      // wall lengths entered/displayed as inner clear
  defaultThickness: 0.5,   // assumed connecting-wall thickness for interior mode
  newWallThickness: 0.5,   // thickness applied to newly drawn walls (0 = line only)
  unitMode: 'ft-in',       // 'ft-in' or 'in' — how lengths are displayed/typed
  nitpickMode: false,      // show/snap fractional inches down to 1/16"
  previewDisplayLen: null, // set by wallSnapPoint, read by renderPreview
  wallCenterSnap: null,    // {x,y,wall,fromStart,fromEnd} when snapped mid-wall
  tileStamp: null,         // {w,h,set,hex,srcR0} copied mosaic design, armed for stamping

  nextId: 1,
  newId() { return this.nextId++; },

  getWall(id)      { return this.walls.find(w => w.id === id); },
  getOpening(id)   { return this.openings.find(o => o.id === id); },
  getFurniture(id) { return this.furniture.find(f => f.id === id); },
  getLabel(id)     { return this.labels.find(l => l.id === id); },
  getTileFill(id)  { return this.tilefills.find(t => t.id === id); },

  // Resolve a {type,id} selection ref to its object
  getObj(ref) {
    if (!ref) return null;
    if (ref.type === 'wall')      return this.getWall(ref.id);
    if (ref.type === 'opening')   return this.getOpening(ref.id);
    if (ref.type === 'furniture') return this.getFurniture(ref.id);
    if (ref.type === 'label')     return this.getLabel(ref.id);
    if (ref.type === 'tile')      return this.getTileFill(ref.id);
    return null;
  },

  // Selection helpers — keep `selected` (single) and `selection` (multi) in sync
  setSelection(arr) {
    this.selection = arr.slice();
    this.selected = arr.length === 1 ? arr[0] : null;
  },
  clearSelection() {
    this.selection = [];
    this.selected = null;
  },
  isSelected(type, id) {
    return this.selection.some(s => s.type === type && s.id === id);
  },
  toggleSelection(type, id) {
    const i = this.selection.findIndex(s => s.type === type && s.id === id);
    if (i >= 0) this.selection.splice(i, 1);
    else this.selection.push({ type, id });
    this.selected = this.selection.length === 1 ? this.selection[0] : null;
  },

  deleteSelected() {
    const sel = this.selection.length ? this.selection
              : (this.selected ? [this.selected] : []);
    if (!sel.length) return;

    const wallIds  = new Set(sel.filter(s => s.type === 'wall').map(s => s.id));
    const openIds  = new Set(sel.filter(s => s.type === 'opening').map(s => s.id));
    const furnIds  = new Set(sel.filter(s => s.type === 'furniture').map(s => s.id));
    const labelIds = new Set(sel.filter(s => s.type === 'label').map(s => s.id));
    const tileIds  = new Set(sel.filter(s => s.type === 'tile').map(s => s.id));

    this.walls     = this.walls.filter(w => !wallIds.has(w.id));
    this.furniture = this.furniture.filter(f => !furnIds.has(f.id));
    this.labels    = this.labels.filter(l => !labelIds.has(l.id));
    this.tilefills = this.tilefills.filter(t => !tileIds.has(t.id));
    // Drop explicitly-selected openings and any opening on a deleted wall
    this.openings  = this.openings.filter(o => !openIds.has(o.id) && !wallIds.has(o.wallId));

    this.clearSelection();
  },

  snapshot() {
    return JSON.parse(JSON.stringify({
      walls: this.walls,
      openings: this.openings,
      furniture: this.furniture,
      labels: this.labels,
      tilefills: this.tilefills,
      nextId: this.nextId,
    }));
  },

  toJSON() {
    return JSON.stringify({
      version: 2,
      walls: this.walls,
      openings: this.openings,
      furniture: this.furniture,
      labels: this.labels,
      tilefills: this.tilefills,
      nextId: this.nextId,
      scale: this.scale,
      panX: this.panX,
      panY: this.panY,
      unitMode: this.unitMode,
      nitpickMode: this.nitpickMode,
      newWallThickness: this.newWallThickness,
    }, null, 2);
  },

  restore(snap) {
    this.walls = snap.walls;
    this.openings = snap.openings;
    this.furniture = snap.furniture;
    this.labels = snap.labels || [];
    this.tilefills = snap.tilefills || [];
    this.nextId = snap.nextId;
    this.clearSelection();
    this.drawing = false;
    this.chainEnd = null;
  },

  fromJSON(json) {
    const d = JSON.parse(json);
    this.walls = d.walls || [];
    this.openings = d.openings || [];
    this.furniture = d.furniture || [];
    this.labels = d.labels || [];
    this.tilefills = d.tilefills || [];
    this.nextId = d.nextId || 1;
    this.scale = d.scale || 40;
    this.panX = d.panX || 80;
    this.panY = d.panY || 80;
    if (d.unitMode) this.unitMode = d.unitMode;
    if (d.nitpickMode != null) this.nitpickMode = d.nitpickMode;
    if (d.newWallThickness != null) this.newWallThickness = d.newWallThickness;
    this.clearSelection();
    this.drawing = false;
    this.chainEnd = null;
  }
};

const Undo = {
  history: [],
  future: [],
  MAX: 60,

  push() {
    this.history.push(State.snapshot());
    if (this.history.length > this.MAX) this.history.shift();
    this.future = [];
  },

  pushRaw(snap) {
    this.history.push(snap);
    if (this.history.length > this.MAX) this.history.shift();
    this.future = [];
  },

  undo() {
    if (!this.history.length) return;
    this.future.push(State.snapshot());
    State.restore(this.history.pop());
  },

  redo() {
    if (!this.future.length) return;
    this.history.push(State.snapshot());
    State.restore(this.future.pop());
  },
};


// ===== utils.js =====
// Coordinate conversions
function toScreen(wx, wy) {
  return { x: wx * State.scale + State.panX, y: wy * State.scale + State.panY };
}

function toWorld(sx, sy) {
  return { x: (sx - State.panX) / State.scale, y: (sy - State.panY) / State.scale };
}

// Angle-snap: keep length but lock direction to nearest `step` degrees
function snapAngle(from, to, step = 15) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const L = Math.sqrt(dx * dx + dy * dy);
  if (L < 0.001) return { x: to.x, y: to.y };
  const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;
  const snapped = Math.round(angleDeg / step) * step;
  const rad = snapped * Math.PI / 180;
  return { x: from.x + L * Math.cos(rad), y: from.y + L * Math.sin(rad) };
}

// Snap furniture/select cursor to inner room corners (wall face intersections at junctions).
function innerCornerSnaps(wx, wy, threshold = 0.5) {
  const candidates = [];
  for (const w of State.walls) {
    const { nx: nx1, ny: ny1 } = wallDir(w);
    const t1 = (w.thickness ?? 0.5) / 2;
    for (const ep of [{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }]) {
      const adj = wallsAt(ep.x, ep.y, w.id);
      for (const { wall: wa } of adj) {
        const { nx: nx2, ny: ny2 } = wallDir(wa);
        const t2 = (wa.thickness ?? 0.5) / 2;
        for (const s1 of [1, -1]) {
          for (const s2 of [1, -1]) {
            candidates.push({
              x: ep.x + s1 * nx1 * t1 + s2 * nx2 * t2,
              y: ep.y + s1 * ny1 * t1 + s2 * ny2 * t2,
            });
          }
        }
      }
    }
  }
  let best = null, bd = threshold;
  for (const c of candidates) {
    const d = dist(c.x, c.y, wx, wy);
    if (d < bd) { best = c; bd = d; }
  }
  return best;
}

// Compute the best wall-drawing point:
//   1. Endpoint snap (always — for connecting walls)
//   2. Angle snap to 15° (when snap enabled)
//   3. Inch-snap the displayed length (always)
// Interior mode: displayed length = IC; actual placed length = IC + defaultThickness.
// Sets State.previewDisplayLen for the preview label.
function wallSnapPoint(rawX, rawY) {
  // Endpoint connection to existing walls only happens when snapping is enabled.
  if (State.snapToGrid) {
    const ep = snapToEndpoints(rawX, rawY, 0.5);
    if (ep) {
      State.previewDisplayLen = null;
      State.wallCenterSnap = null;
      return ep;
    }
    // Then snap to a point along a wall's centerline (T-junction).
    const cl = snapToWallCenterline(rawX, rawY);
    if (cl) {
      State.previewDisplayLen = null;
      State.wallCenterSnap = cl;
      return { x: cl.x, y: cl.y };
    }
  }
  State.wallCenterSnap = null;

  const from = State.chainEnd || State.drawStart;
  if (!from) return { x: rawX, y: rawY };

  let dx = rawX - from.x, dy = rawY - from.y;
  let L = Math.sqrt(dx * dx + dy * dy);
  if (L < 0.001) return { x: rawX, y: rawY };
  let ux = dx / L, uy = dy / L;

  if (State.snapToGrid) {
    const angleDeg = Math.atan2(uy, ux) * 180 / Math.PI;
    const snappedAngle = Math.round(angleDeg / 15) * 15;
    const rad = snappedAngle * Math.PI / 180;
    ux = Math.cos(rad); uy = Math.sin(rad);
  }

  // Interior-mode trims must mirror what the dimension label will show once the
  // wall is placed: the REAL trim where the start connects to existing walls
  // (corner or T-junction — the connecting wall's half-thickness), and this
  // wall's own half-thickness at the still-free end (the label's assumed trim).
  const thick = State.newWallThickness ?? State.defaultThickness ?? 0.5;
  let d1 = 0, d2 = 0;
  if (State.interiorMode) {
    const probe = { id: -1e9, x1: from.x, y1: from.y, x2: from.x + ux * L, y2: from.y + uy * L, thickness: thick };
    d1 = innerTrimAt(probe, from.x, from.y);
    if (d1 <= 0.02) d1 = thick / 2;   // free start — assume our own half
    d2 = thick / 2;                   // end is free while drawing
  }
  const rawDisplay = Math.max(1 / 12, L - d1 - d2);
  // While snapping is on, round length to whole inches — or 1/16" in nitpick mode.
  const perInch = State.nitpickMode ? 16 : 1;
  const displayLen = State.snapToGrid
    ? Math.max(1 / 12, Math.round(rawDisplay * 12 * perInch) / (12 * perInch))
    : Math.max(1 / 12, rawDisplay);
  const actualLen  = displayLen + d1 + d2;

  State.previewDisplayLen = displayLen;
  return { x: from.x + actualLen * ux, y: from.y + actualLen * uy };
}

// Snap onto the centerline of the nearest wall (a mid-wall T-junction). Returns
// {x,y,wall,fromStart,fromEnd} or null. The position is inch-snapped ALONG the
// wall (1/16" in nitpick mode) so distances from the ends land on clean values.
// Endpoints are skipped here — callers try snapToEndpoints first so corners win.
function snapToWallCenterline(wx, wy) {
  let best = null, bd = Infinity;
  for (const w of State.walls) {
    const r = nearestOnWall(w, wx, wy);
    if (r.t <= 0.001 || r.t >= 0.999) continue;       // ends handled elsewhere
    const thr = (w.thickness ?? 0.5) / 2 + 0.4;        // grab anywhere on the wall body
    if (r.dist < thr && r.dist < bd) { best = { wall: w, ...r }; bd = r.dist; }
  }
  if (!best) return null;
  const w = best.wall;
  const L = wallLength(w);
  const perInch = State.nitpickMode ? 16 : 1;
  const { ux, uy, nx, ny } = wallDir(w);
  const alongRaw = best.t * L;
  const px0 = w.x1 + alongRaw * ux, py0 = w.y1 + alongRaw * uy;
  // Which side of the wall the cursor is on (drives both the readout side and
  // which crossing walls bound the measurement).
  const side = ((wx - px0) * nx + (wy - py0) * ny) < 0 ? -1 : 1;
  const m = wallSideMeasure(w, alongRaw, side, L);
  // The wall about to be placed has its own thickness; subtract its half-width
  // (assume it meets squarely) so the readout is the clear gap that will remain.
  const halfNew = (State.newWallThickness ?? 0.5) / 2;
  // Quantize the CLEAR GAP from the nearer bounding wall to whole inches
  // (1/16" in nitpick mode) — not the raw position — so an exact clearance
  // like 30" is always reachable even when wall thicknesses are odd.
  const q = 12 * perInch;
  let along;
  if (alongRaw - m.startBound <= m.endBound - alongRaw) {
    const gap = Math.max(0, Math.round((alongRaw - m.startBound - halfNew) * q) / q);
    along = clamp(m.startBound + halfNew + gap, 0, L);
  } else {
    const gap = Math.max(0, Math.round((m.endBound - alongRaw - halfNew) * q) / q);
    along = clamp(m.endBound - halfNew - gap, 0, L);
  }
  return {
    x: w.x1 + along * ux, y: w.y1 + along * uy,
    wall: w, side, halfNew,
    startBound: m.startBound, endBound: m.endBound,
    fromStart: Math.max(0, along - m.startBound - halfNew),
    fromEnd: Math.max(0, m.endBound - along - halfNew),
  };
}

// Where (and at what half-width) another wall crosses this wall's centerline.
// Returns {pos, halfWidth} along w (feet from w.x1), or null. Endpoint touches
// (corners, T-junctions) are included via a small tolerance.
function wallCrossing(w, wo) {
  const r1x = w.x2 - w.x1, r1y = w.y2 - w.y1;
  const r2x = wo.x2 - wo.x1, r2y = wo.y2 - wo.y1;
  const den = r1x * r2y - r1y * r2x;
  if (Math.abs(den) < 1e-9) return null;                 // parallel
  const tx = wo.x1 - w.x1, ty = wo.y1 - w.y1;
  const t = (tx * r2y - ty * r2x) / den;                 // param along w
  const u = (tx * r1y - ty * r1x) / den;                 // param along wo
  const L1 = Math.hypot(r1x, r1y), L2 = Math.hypot(r2x, r2y);
  const tolT = 0.001 + 0.05 / Math.max(L1, 1e-6);
  const tolU = 0.001 + 0.05 / Math.max(L2, 1e-6);
  if (t < -tolT || t > 1 + tolT || u < -tolU || u > 1 + tolU) return null;
  const sinTheta = Math.abs(r1x * r2y - r1y * r2x) / (L1 * L2);
  if (sinTheta < 0.08) return null;                      // near-parallel touch
  return { pos: clamp(t, 0, 1) * L1, halfWidth: (wo.thickness ?? 0.5) / 2 / sinTheta };
}

// Distances along a wall from `along` to its bounding walls on the cursor side.
//   • A crossing wall whose body is on the cursor's side is a barrier — measure
//     to its near face (gives interior clear, and stops at interior partitions).
//   • A crossing only on the opposite side wraps the corner at the wall's ends —
//     it extends the measurement out to its far (outer) face, giving the outer
//     overall on an exterior face. Mid-span opposite-side walls don't affect it.
function wallSideMeasure(w, along, side, L) {
  L = L || wallLength(w);
  const { ux, uy, nx, ny } = wallDir(w);
  const eps = 0.05;
  let barrierStart = null, barrierEnd = null;  // nearest cursor-side wall each way
  let cornerStart = 0, cornerEnd = L;          // outer-corner wrap at the ends
  for (const wo of State.walls) {
    if (wo.id === w.id) continue;
    const c = wallCrossing(w, wo);
    if (!c) continue;
    const jx = w.x1 + c.pos * ux, jy = w.y1 + c.pos * uy;
    const dA = (wo.x1 - jx) * nx + (wo.y1 - jy) * ny;
    const dB = (wo.x2 - jx) * nx + (wo.y2 - jy) * ny;
    const occCursor = side > 0 ? (dA > eps || dB > eps) : (dA < -eps || dB < -eps);
    const occOpp    = side > 0 ? (dA < -eps || dB < -eps) : (dA > eps || dB > eps);
    if (occCursor) {
      const faceStart = c.pos + c.halfWidth;   // near face toward the start-side region
      const faceEnd = c.pos - c.halfWidth;     // near face toward the end-side region
      if (faceStart <= along + 1e-6 && (barrierStart === null || faceStart > barrierStart)) barrierStart = faceStart;
      if (faceEnd >= along - 1e-6 && (barrierEnd === null || faceEnd < barrierEnd)) barrierEnd = faceEnd;
    } else if (occOpp) {
      // Only end crossings (whose far face passes the wall end) wrap the corner.
      if (c.pos - c.halfWidth < cornerStart) cornerStart = c.pos - c.halfWidth;
      if (c.pos + c.halfWidth > cornerEnd) cornerEnd = c.pos + c.halfWidth;
    }
  }
  const startBound = barrierStart !== null ? barrierStart : cornerStart;
  const endBound = barrierEnd !== null ? barrierEnd : cornerEnd;
  return {
    startBound, endBound,
    fromStart: Math.max(0, along - startBound),
    fromEnd: Math.max(0, endBound - along),
  };
}

// Round a world point to the nearest inch (or 1/16" in nitpick mode).
function snapToInchGrid(wx, wy) {
  const perInch = State.nitpickMode ? 16 : 1;
  const step = 1 / (12 * perInch); // feet per division
  return { x: Math.round(wx / step) * step, y: Math.round(wy / step) * step };
}

// Kept for legacy
function snapWorld(wx, wy) {
  const g = State.gridFeet;
  return { x: Math.round(wx / g) * g, y: Math.round(wy / g) * g };
}

// Format a count of 1/16-inch units as inches with a simplified fraction:
//   104 → "6 1/2"   10 → "5/8"   96 → "6"
function fmtInchSixteenths(sixteenths) {
  const whole = Math.floor(sixteenths / 16);
  let num = sixteenths % 16;
  if (num === 0) return `${whole}`;
  let den = 16;
  while (num % 2 === 0) { num /= 2; den /= 2; } // simplify (10/16 → 5/8)
  return whole === 0 ? `${num}/${den}` : `${whole} ${num}/${den}`;
}

// Format a length (in feet) for display, honoring State.unitMode and nitpick mode.
//   'ft-in': 12.5 → "12' 6\""    'in': 12.5 → "150\""
//   nitpick: lengths quantized/shown to 1/16" (e.g. "6 5/8\"")
function fmtFt(feet) {
  if (State.nitpickMode) {
    const sixteenths = Math.round(Math.abs(feet) * 192 + 1e-7); // 12 in * 16; epsilon guards FP dust
    const sign = sixteenths && feet < 0 ? '-' : '';
    if (State.unitMode === 'in') return `${sign}${fmtInchSixteenths(sixteenths)}"`;
    const ft = Math.floor(sixteenths / 192);
    const rem = sixteenths - ft * 192;
    if (rem === 0) return `${sign}${ft}'`;
    return `${sign}${ft}' ${fmtInchSixteenths(rem)}"`;
  }

  const totalIn = Math.round(Math.abs(feet) * 12 + 1e-7); // epsilon guards FP dust at .5"
  const sign = totalIn && feet < 0 ? '-' : '';
  if (State.unitMode === 'in') return `${sign}${totalIn}"`;
  const ft = Math.floor(totalIn / 12);
  const inch = totalIn % 12;
  if (inch === 0) return `${sign}${ft}'`;
  return `${sign}${ft}' ${inch}"`;
}

// Parse an inch portion that may include a fraction: "6 1/2", "5/8", "6", "6.5".
function parseInchPart(s) {
  s = s.replace(/"/g, '').trim();
  if (!s) return 0;
  let total = 0;
  const fracM = s.match(/(\d+)\s*\/\s*(\d+)/);
  if (fracM) {
    const den = parseInt(fracM[2], 10);
    if (den) total += parseInt(fracM[1], 10) / den;
    s = s.replace(fracM[0], '').trim();
  }
  if (s) { const n = parseFloat(s); if (!isNaN(n)) total += n; }
  return total;
}

// Parse a length string into feet. Understands explicit unit marks regardless
// of the current mode, so "14\"" → 14 inches even in feet & inches mode and a
// label re-rendered as "1' 2\"". Fractional inches are accepted. Forms:
//   12' 6"   12'6"   12'   6"   14"   12' 6 1/2"   6 5/8"   12.5
// A bare number with no mark is feet in ft-in mode, inches in inches-only mode.
function parseFt(str) {
  str = String(str).trim();
  if (!str) return 0;

  const neg = str.startsWith('-');
  if (neg) str = str.slice(1).trim();

  let feet = 0, inch = 0, matched = false;

  const ftIdx = str.indexOf("'");
  if (ftIdx >= 0) {
    feet = parseFloat(str.slice(0, ftIdx)) || 0;
    inch = parseInchPart(str.slice(ftIdx + 1));
    matched = true;
  } else if (str.includes('"') || str.includes('/')) {
    inch = parseInchPart(str);
    matched = true;
  }

  if (matched) {
    const mag = Math.abs(feet) + Math.abs(inch) / 12;
    return neg ? -mag : mag;
  }

  const n = parseFloat(str);
  if (isNaN(n)) return 0;
  const v = State.unitMode === 'in' ? n / 12 : n;
  return neg ? -v : v;
}

function dist(x1, y1, x2, y2) {
  return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

function wallLength(w) {
  return dist(w.x1, w.y1, w.x2, w.y2);
}

function wallAngleDeg(w) {
  return Math.atan2(w.y2 - w.y1, w.x2 - w.x1) * 180 / Math.PI;
}

function wallDir(w) {
  const L = wallLength(w);
  if (L === 0) return { ux: 1, uy: 0, nx: 0, ny: -1 };
  const ux = (w.x2 - w.x1) / L;
  const uy = (w.y2 - w.y1) / L;
  return { ux, uy, nx: -uy, ny: ux };
}

// Point along wall at parameter t (0=start,1=end)
function wallPoint(w, t) {
  return { x: w.x1 + t * (w.x2 - w.x1), y: w.y1 + t * (w.y2 - w.y1) };
}

// Nearest point on wall to world point, returns {t, px, py, dist}
function nearestOnWall(w, wx, wy) {
  const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return { t: 0, px: w.x1, py: w.y1, dist: dist(w.x1, w.y1, wx, wy) };
  let t = ((wx - w.x1) * dx + (wy - w.y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const px = w.x1 + t * dx, py = w.y1 + t * dy;
  return { t, px, py, dist: dist(px, py, wx, wy) };
}

// Find nearest wall to a world point within threshold (feet)
function nearestWall(wx, wy, threshold = 1.5) {
  let best = null, bd = Infinity;
  for (const w of State.walls) {
    const r = nearestOnWall(w, wx, wy);
    if (r.dist < bd && r.dist < threshold) { best = { wall: w, ...r }; bd = r.dist; }
  }
  return best;
}

// Find snap target: endpoint of existing walls
function snapToEndpoints(wx, wy, threshold = 0.4) {
  for (const w of State.walls) {
    if (dist(w.x1, w.y1, wx, wy) < threshold) return { x: w.x1, y: w.y1 };
    if (dist(w.x2, w.y2, wx, wy) < threshold) return { x: w.x2, y: w.y2 };
  }
  return null;
}

// Angle between two direction vectors in degrees [0,360)
function angleBetween(ax, ay, bx, by) {
  const a = Math.atan2(ay, ax);
  const b = Math.atan2(by, bx);
  let deg = (b - a) * 180 / Math.PI;
  if (deg < 0) deg += 360;
  return deg;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function fmtAngle(deg) {
  return `${Math.round(deg)}°`;
}

// SVG path arc helper: large-arc-flag, sweep-flag
function svgArc(cx, cy, r, startAngle, endAngle) {
  const s = startAngle * Math.PI / 180;
  const e = endAngle * Math.PI / 180;
  const x1 = cx + r * Math.cos(s), y1 = cy + r * Math.sin(s);
  const x2 = cx + r * Math.cos(e), y2 = cy + r * Math.sin(e);
  let da = endAngle - startAngle;
  if (da < 0) da += 360;
  const large = da > 180 ? 1 : 0;
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

// Move one endpoint of a wall (end = 1|2) to (nx2,ny2), carrying along any other
// wall endpoints that share the old corner so connections stay intact.
function moveWallEnd(w, end, nx2, ny2) {
  const ox = end === 1 ? w.x1 : w.x2;
  const oy = end === 1 ? w.y1 : w.y2;
  for (const wo of State.walls) {
    if (wo.id === w.id) continue;
    if (dist(wo.x1, wo.y1, ox, oy) < 0.05) { wo.x1 = nx2; wo.y1 = ny2; }
    if (dist(wo.x2, wo.y2, ox, oy) < 0.05) { wo.x2 = nx2; wo.y2 = ny2; }
  }
  if (end === 1) { w.x1 = nx2; w.y1 = ny2; } else { w.x2 = nx2; w.y2 = ny2; }
}

// Walls that share endpoint (px,py), excluding skipId.
// Returns { wall, ax, ay } where (ax,ay) is the unit direction going AWAY from (px,py).
function wallsAt(px, py, skipId, threshold = 0.15) {
  const result = [];
  for (const w of State.walls) {
    if (w.id === skipId) continue;
    if (dist(w.x1, w.y1, px, py) < threshold) {
      const L = wallLength(w) || 1;
      result.push({ wall: w, ax: (w.x2 - w.x1) / L, ay: (w.y2 - w.y1) / L });
    } else if (dist(w.x2, w.y2, px, py) < threshold) {
      const L = wallLength(w) || 1;
      result.push({ wall: w, ax: (w.x1 - w.x2) / L, ay: (w.y1 - w.y2) / L });
    }
  }
  return result;
}

// How much to trim the dimension line at one endpoint for the inner span.
// Formula: at a junction, the inner face of the crossing wall is at distance
//   (crossingWall.thickness/2) / sin(angle between walls) along the current wall.
// Counts both walls that share this endpoint (corners) and a wall this endpoint
// lands on mid-span (a T-junction, e.g. a divider drawn between two walls).
function innerTrimAt(wall, px, py) {
  const { ux, uy } = wallDir(wall);
  let delta = 0;
  const consider = (wa, ax, ay) => {
    const sinTheta = Math.abs(ux * ay - uy * ax); // |sin| of angle between the two walls
    if (sinTheta < 0.08) return;                  // skip nearly-parallel walls
    const d = (wa.thickness ?? 0.5) / 2 / sinTheta;
    // Sanity-cap: ignore if trim would eat more than half the wall (extreme angles)
    if (d < wallLength(wall) * 0.45) delta = Math.max(delta, d);
  };
  for (const { wall: wa, ax, ay } of wallsAt(px, py, wall.id)) consider(wa, ax, ay);
  // T-junction host: this endpoint lies on another wall's centerline mid-span.
  for (const wa of State.walls) {
    if (wa.id === wall.id) continue;
    const r = nearestOnWall(wa, px, py);
    if (r.dist < 0.05 && r.t > 0.02 && r.t < 0.98) {
      const dir = wallDir(wa);
      consider(wa, dir.ux, dir.uy);
    }
  }
  return delta;
}

// ── Polygon / room helpers ──────────────────────────────────────────────────

// Even-odd ray cast. poly is an array of {x,y}.
function pointInPolygon(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    const intersect = ((yi > py) !== (yj > py)) &&
      (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// Signed shoelace area.
function polygonArea(poly) {
  let a = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    a += (poly[j].x + poly[i].x) * (poly[j].y - poly[i].y);
  }
  return a / 2;
}

// Find the smallest closed room (loop of walls) enclosing (px,py), as a polygon
// of wall-centerline points, or null. Planar minimal-face traversal of the wall
// graph: each wall is two directed half-edges; faces are traced by repeatedly
// taking the next-clockwise outgoing edge at each node.
function findRoomPolygon(px, py) {
  const walls = State.walls;
  if (walls.length < 3) return null;

  const Q = 1e3; // quantize endpoints to 1/1000 ft
  const key = (x, y) => `${Math.round(x * Q)},${Math.round(y * Q)}`;
  const nodes = new Map();
  const nodeKey = (x, y) => { const k = key(x, y); if (!nodes.has(k)) nodes.set(k, { x, y }); return k; };

  const edges = [];           // {from, to, ang, used}
  const outMap = new Map();   // nodeKey -> [edgeIndex]
  const addEdge = (ax, ay, bx, by) => {
    const fk = nodeKey(ax, ay), tk = nodeKey(bx, by);
    if (fk === tk) return;
    const idx = edges.length;
    edges.push({ from: fk, to: tk, ang: Math.atan2(by - ay, bx - ax), used: false });
    if (!outMap.has(fk)) outMap.set(fk, []);
    outMap.get(fk).push(idx);
  };
  for (const w of walls) {
    if (wallLength(w) < 1e-6) continue;
    // Subdivide the wall at any point where another wall's endpoint lands on it
    // mid-span (a T-junction), so dividers actually connect into the graph.
    const ts = [0, 1];
    for (const wo of walls) {
      if (wo.id === w.id) continue;
      for (const ep of [{ x: wo.x1, y: wo.y1 }, { x: wo.x2, y: wo.y2 }]) {
        const r = nearestOnWall(w, ep.x, ep.y);
        if (r.dist < 0.02 && r.t > 0.001 && r.t < 0.999) ts.push(r.t);
      }
    }
    ts.sort((a, b) => a - b);
    const uniq = [];
    for (const t of ts) if (!uniq.length || t - uniq[uniq.length - 1] > 1e-4) uniq.push(t);
    for (let i = 0; i < uniq.length - 1; i++) {
      const a = wallPoint(w, uniq[i]), b = wallPoint(w, uniq[i + 1]);
      addEdge(a.x, a.y, b.x, b.y);
      addEdge(b.x, b.y, a.x, a.y);
    }
  }
  for (const arr of outMap.values()) arr.sort((a, b) => edges[a].ang - edges[b].ang);

  // Next half-edge along the current face: at the arrival node, take the
  // outgoing edge that is the next one clockwise from the reverse direction
  // (largest angle strictly below `rev`, wrapping to the max if none).
  const nextInFace = (ei) => {
    const e = edges[ei];
    const arr = outMap.get(e.to);
    if (!arr || !arr.length) return -1;
    let rev = e.ang + Math.PI;
    if (rev > Math.PI) rev -= 2 * Math.PI;
    let chosen = -1, chosenAng = -Infinity, maxIdx = -1, maxAng = -Infinity;
    for (const j of arr) {
      const a = edges[j].ang;
      if (a > maxAng) { maxAng = a; maxIdx = j; }
      if (a < rev - 1e-9 && a > chosenAng) { chosenAng = a; chosen = j; }
    }
    return chosen !== -1 ? chosen : maxIdx;
  };

  const faces = [];
  for (let i = 0; i < edges.length; i++) {
    if (edges[i].used) continue;
    const poly = [];
    let cur = i, guard = 0;
    while (cur !== -1 && !edges[cur].used && guard < edges.length * 4) {
      edges[cur].used = true;
      poly.push(nodes.get(edges[cur].from));
      cur = nextInFace(cur);
      guard++;
      if (cur === i) break;
    }
    if (cur === i && poly.length >= 3) faces.push(poly);
  }

  // Smallest-area face that contains the click (excludes the big outer face).
  let best = null, bestArea = Infinity;
  for (const poly of faces) {
    const area = Math.abs(polygonArea(poly));
    if (area < 1e-3) continue;
    if (area < bestArea && pointInPolygon(px, py, poly)) { best = poly; bestArea = area; }
  }
  return best ? best.map(p => ({ x: p.x, y: p.y })) : null;
}

// Generate the tile cells for a tilefill in WORLD coordinates. Shared by the
// on-screen renderer and the PNG exporter so the two never diverge.
// Returns { cells:[{key, pts:[{x,y}…]}], bbox:{minX,minY,maxX,maxY}, truncated? }.
const TILE_MAX_CELLS = 40000;

// Lattice parameters for a tilefill (pointy-top, odd-r offset for hex).
function tileLattice(tf) {
  const grout = Math.max(0, tf.grout || 0);
  if (tf.shape === 'hex') {
    const s = Math.max(0.01, tf.tileW || 0.25);
    return { hex: true, s, colSp: Math.sqrt(3) * s, rowSp: 1.5 * s, R: Math.max(0.001, s - grout / Math.sqrt(3)) };
  }
  const w = Math.max(0.01, tf.tileW || 0.5);
  const h = Math.max(0.01, tf.tileH || 0.5);
  return { hex: false, w, h, pw: w + grout, ph: h + grout, grout };
}

// World-coordinate polygon for the cell at lattice index (c,r).
function tileCellPolygon(tf, c, r) {
  const ox = tf.offsetX || 0, oy = tf.offsetY || 0;
  const L = tileLattice(tf);
  if (L.hex) {
    const cx = ox + ((r & 1) ? L.colSp / 2 : 0) + c * L.colSp;
    const cy = oy + r * L.rowSp;
    const pts = [];
    for (let k = 0; k < 6; k++) { const a = (30 + 60 * k) * Math.PI / 180; pts.push({ x: cx + L.R * Math.cos(a), y: cy + L.R * Math.sin(a) }); }
    return pts;
  }
  const x0 = ox + c * L.pw + L.grout / 2, y0 = oy + r * L.ph + L.grout / 2;
  return [{ x: x0, y: y0 }, { x: x0 + L.w, y: y0 }, { x: x0 + L.w, y: y0 + L.h }, { x: x0, y: y0 + L.h }];
}

// Lattice index of the cell containing world point (wx,wy). Returns {c,r,key}.
function tileCellAt(tf, wx, wy) {
  const ox = tf.offsetX || 0, oy = tf.offsetY || 0;
  const L = tileLattice(tf);
  if (L.hex) {
    // pixel → axial (pointy-top) → cube round → odd-r offset
    const px = wx - ox, py = wy - oy;
    const q = (Math.sqrt(3) / 3 * px - 1 / 3 * py) / L.s;
    const rr = (2 / 3 * py) / L.s;
    let x = q, z = rr, y = -x - z;
    let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
    const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
    if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
    const row = rz, col = rx + (rz - (rz & 1)) / 2;
    return { c: col, r: row, key: `${col},${row}` };
  }
  const c = Math.floor((wx - ox) / L.pw), r = Math.floor((wy - oy) / L.ph);
  return { c, r, key: `${c},${r}` };
}

function tileFillCells(tf) {
  const poly = tf.roomPoly;
  if (!poly || poly.length < 3) return { cells: [], bbox: null };
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of poly) {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
  }
  const bbox = { minX, minY, maxX, maxY };
  const cells = [];
  const ox = tf.offsetX || 0, oy = tf.offsetY || 0;
  const L = tileLattice(tf);

  if (L.hex) {
    const r0 = Math.floor((minY - oy - L.s) / L.rowSp) - 1;
    const r1 = Math.ceil((maxY - oy + L.s) / L.rowSp) + 1;
    for (let r = r0; r <= r1; r++) {
      const xoff = (r & 1) ? L.colSp / 2 : 0;
      const c0 = Math.floor((minX - ox - xoff) / L.colSp) - 1;
      const c1 = Math.ceil((maxX - ox - xoff) / L.colSp) + 1;
      for (let c = c0; c <= c1; c++) {
        cells.push({ key: `${c},${r}`, pts: tileCellPolygon(tf, c, r) });
        if (cells.length > TILE_MAX_CELLS) return { cells, bbox, truncated: true };
      }
    }
  } else {
    const c0 = Math.floor((minX - ox) / L.pw) - 1;
    const c1 = Math.ceil((maxX - ox) / L.pw) + 1;
    const r0 = Math.floor((minY - oy) / L.ph) - 1;
    const r1 = Math.ceil((maxY - oy) / L.ph) + 1;
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        cells.push({ key: `${c},${r}`, pts: tileCellPolygon(tf, c, r) });
        if (cells.length > TILE_MAX_CELLS) return { cells, bbox, truncated: true };
      }
    }
  }
  return { cells, bbox };
}

// ── Tile area stats ─────────────────────────────────────────────────────────

// Intersection of two infinite lines given as {px,py,dx,dy}. Null if parallel.
function lineIntersect(l1, l2) {
  const den = l1.dx * l2.dy - l1.dy * l2.dx;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((l2.px - l1.px) * l2.dy - (l2.py - l1.py) * l2.dx) / den;
  return { x: l1.px + t * l1.dx, y: l1.py + t * l1.dy };
}

// Thickness of the wall whose centerline carries the polygon edge a–b.
function edgeWallThickness(a, b) {
  for (const w of State.walls) {
    if (nearestOnWall(w, a.x, a.y).dist < 0.02 && nearestOnWall(w, b.x, b.y).dist < 0.02) {
      return w.thickness ?? 0.5;
    }
  }
  return State.defaultThickness || 0.5;
}

// Inset a room (centerline) polygon inward by each edge's wall half-thickness to
// get the interior-floor polygon. This is what the user measures inside the room.
function interiorPolygon(roomPoly) {
  const n = roomPoly.length;
  if (n < 3) return roomPoly.slice();
  const lines = [];
  for (let i = 0; i < n; i++) {
    const a = roomPoly[i], b = roomPoly[(i + 1) % n];
    let dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    let nx = -dy, ny = dx;                       // inward normal
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (!pointInPolygon(mx + nx * 1e-3, my + ny * 1e-3, roomPoly)) { nx = -nx; ny = -ny; }
    const off = edgeWallThickness(a, b) / 2;
    lines.push({ px: a.x + nx * off, py: a.y + ny * off, dx, dy });
  }
  const out = [];
  for (let i = 0; i < n; i++) {
    const p = lineIntersect(lines[(i - 1 + n) % n], lines[i]);
    out.push(p || roomPoly[i]);
  }
  return out;
}

// Is world point (px,py) inside furniture f (honors rotation; rect or ellipse)?
function pointInFurniture(px, py, f) {
  const rot = -(f.rotation || 0) * Math.PI / 180;
  const dx = px - f.x, dy = py - f.y;
  const lx = dx * Math.cos(rot) - dy * Math.sin(rot);
  const ly = dx * Math.sin(rot) + dy * Math.cos(rot);
  const hw = f.width / 2, hh = f.height / 2;
  if (f.type === 'circle') return (lx * lx) / (hw * hw) + (ly * ly) / (hh * hh) <= 1;
  return Math.abs(lx) <= hw && Math.abs(ly) <= hh;
}

// Area breakdown for a tile fill (sq ft). Interior area is exact (polygon inset);
// the per-color and exclusion areas are estimated by dense point sampling, which
// robustly handles partial tiles, grout gaps, and clipped/rotated furniture.
function tileFillStats(tf) {
  const interiorPoly = interiorPolygon(tf.roomPoly);
  const interiorArea = Math.abs(polygonArea(interiorPoly));

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of interiorPoly) {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
  }

  const wft = Math.max(0.01, maxX - minX), hft = Math.max(0.01, maxY - minY);
  let step = Math.sqrt((wft * hft) / 60000);
  step = clamp(step, 0.01, 0.25);
  const excluded = State.furniture.filter(f => f.noFloor);
  const painted = tf.painted || {};

  let base = 0, accent = 0, excl = 0, floorN = 0;
  for (let x = minX + step / 2; x < maxX; x += step) {
    for (let y = minY + step / 2; y < maxY; y += step) {
      if (!pointInPolygon(x, y, interiorPoly)) continue;
      floorN++;
      if (excluded.some(f => pointInFurniture(x, y, f))) { excl++; continue; }
      const cell = tileCellAt(tf, x, y);
      if (!pointInPolygon(x, y, tileCellPolygon(tf, cell.c, cell.r))) continue; // grout gap
      if (painted[cell.key]) accent++; else base++;
    }
  }
  // Normalize sampled counts against the exact interior area so the parts stay
  // consistent (base/accent never exceed the room, and totals add up).
  const a = floorN ? interiorArea / floorN : 0;
  return {
    interiorArea,
    exclArea: excl * a,
    floorArea: Math.max(0, interiorArea - excl * a),
    baseArea: base * a,
    accentArea: accent * a,
    hasExclusions: excluded.length > 0,
  };
}

function fmtArea(sqft) {
  return `${sqft < 10 ? sqft.toFixed(2) : sqft.toFixed(1)} sq ft`;
}

// Split a wall's inner-clear span [s0,s1] into clear segments around any wall
// that Ts into its middle. With no mid-span crossing it returns the whole span.
function wallInnerSegments(w, s0, s1) {
  const bars = [];
  for (const wo of State.walls) {
    if (wo.id === w.id) continue;
    const c = wallCrossing(w, wo);
    if (!c) continue;
    if (c.pos <= s0 + 0.05 || c.pos >= s1 - 0.05) continue;   // end walls / outside span
    bars.push({ lo: c.pos - c.halfWidth, hi: c.pos + c.halfWidth });
  }
  if (!bars.length) return [{ from: s0, to: s1 }];
  bars.sort((a, b) => a.lo - b.lo);
  const merged = [bars[0]];
  for (let i = 1; i < bars.length; i++) {
    const last = merged[merged.length - 1];
    if (bars[i].lo <= last.hi + 0.01) last.hi = Math.max(last.hi, bars[i].hi);
    else merged.push(bars[i]);
  }
  const segs = [];
  let pos = s0;
  for (const b of merged) {
    const to = clamp(b.lo, s0, s1);
    if (to - pos > 0.05) segs.push({ from: pos, to });
    pos = Math.max(pos, Math.min(b.hi, s1));
  }
  if (s1 - pos > 0.05) segs.push({ from: pos, to: s1 });
  return segs;
}

// Group walls into maximal runs of collinear, end-to-end connected segments.
// A wall split into pieces (e.g. two rooms sharing a straight exterior wall)
// becomes one run, so a single end-to-end exterior dimension can be drawn.
function wallRuns() {
  const walls = State.walls;
  const parent = walls.map((_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };

  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (collinearConnected(walls[i], walls[j])) parent[find(i)] = find(j);
    }
  }
  const groups = {};
  for (let i = 0; i < walls.length; i++) {
    const r = find(i);
    (groups[r] || (groups[r] = [])).push(walls[i]);
  }
  return Object.values(groups);
}

// Two walls are part of the same run when they're parallel and share an
// endpoint (parallel + shared point ⇒ same line).
function collinearConnected(a, b) {
  const da = wallDir(a), db = wallDir(b);
  if (Math.abs(da.ux * db.uy - da.uy * db.ux) > 0.02) return false;   // not parallel (~1°)
  const ap = [{ x: a.x1, y: a.y1 }, { x: a.x2, y: a.y2 }];
  const bp = [{ x: b.x1, y: b.y1 }, { x: b.x2, y: b.y2 }];
  for (const p of ap) for (const q of bp) if (dist(p.x, p.y, q.x, q.y) < 0.15) return true;
  return false;
}

// Nudge a furniture piece so one of ITS corners sits exactly on a nearby inner
// wall corner — flush against both walls, never inside them. Handles rotations
// that are multiples of 90°; other angles are left where they are.
function snapFurnitureFlush(f, threshold = 0.4) {
  const rot = (((f.rotation || 0) % 180) + 180) % 180;
  let hw, hh;
  if (rot < 0.5 || rot > 179.5) { hw = f.width / 2; hh = f.height / 2; }
  else if (Math.abs(rot - 90) < 0.5) { hw = f.height / 2; hh = f.width / 2; }
  else return;

  let best = null, bd = threshold;
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const fcx = f.x + sx * hw, fcy = f.y + sy * hh;
    const ic = innerCornerSnaps(fcx, fcy, bd);
    if (!ic) continue;
    const d = dist(ic.x, ic.y, fcx, fcy);
    if (d < bd) { bd = d; best = { dx: ic.x - fcx, dy: ic.y - fcy }; }
  }
  if (best) { f.x += best.dx; f.y += best.dy; }
}

// Furniture color scheme derived from its base color (default green):
// stroke = the color, fill = translucent version, text = darkened version.
const FURN_DEFAULT_COLOR = '#2d7a3a';
function furnColors(f) {
  let hex = f.color || FURN_DEFAULT_COLOR;
  let m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) { hex = FURN_DEFAULT_COLOR; m = /^#?([0-9a-f]{6})$/i.exec(hex); }
  const n = parseInt(m[1], 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const dk = c => Math.round(c * 0.55);
  return {
    stroke: hex,
    fill: `rgba(${r},${g},${b},0.28)`,
    text: `rgb(${dk(r)},${dk(g)},${dk(b)})`,
  };
}

function makeSVGEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) {
    el.setAttribute(k, v);
  }
  return el;
}


// ===== render.js =====
function render() {
  renderGrid();
  renderTiles();
  renderWalls();
  renderOpenings();
  renderFurniture();
  renderLabels();
  renderDimensions();
  renderAngles();
  renderReference();
  renderSelection();
}

// ── Reference point ─────────────────────────────────────────────────────────
// A right-click-placed measurement origin. Shows a marker, a dashed line to the
// cursor, and feeds the distance readout in the status bar.
function renderReference() {
  const layer = document.getElementById('layer-reference');
  layer.innerHTML = '';
  const ref = State.referencePoint;
  if (!ref) return;

  const cur = State.rawMouseWorld || State.mouseWorld;
  const rp = toScreen(ref.x, ref.y);
  const mp = toScreen(cur.x, cur.y);

  layer.appendChild(makeSVGEl('line', {
    x1: rp.x, y1: rp.y, x2: mp.x, y2: mp.y,
    class: 'ref-line',
  }));

  // Distance label at the middle of the line, nudged clear of it.
  const d = dist(ref.x, ref.y, cur.x, cur.y);
  if (d > 0.02) {
    const ang = Math.atan2(mp.y - rp.y, mp.x - rp.x);
    const mid = { x: (rp.x + mp.x) / 2 + Math.sin(ang) * 12, y: (rp.y + mp.y) / 2 - Math.cos(ang) * 12 };
    dimLabel(layer, mid, fmtFt(d), 'ref-text', 54, 18);
  }

  // Crosshair marker at the reference point
  const r = 7;
  layer.appendChild(makeSVGEl('circle', { cx: rp.x, cy: rp.y, r, class: 'ref-marker' }));
  layer.appendChild(makeSVGEl('line', { x1: rp.x - r - 3, y1: rp.y, x2: rp.x + r + 3, y2: rp.y, class: 'ref-cross' }));
  layer.appendChild(makeSVGEl('line', { x1: rp.x, y1: rp.y - r - 3, x2: rp.x, y2: rp.y + r + 3, class: 'ref-cross' }));
}

// ── Grid ──────────────────────────────────────────────────────────────────
function renderGrid() {
  const gm = document.getElementById('grid-major');
  const gn = document.getElementById('grid-minor');
  const rect = document.getElementById('grid-rect');

  const majPx = State.scale;        // 1 foot in pixels
  const minPx = State.scale / 2;    // 6 inches in pixels

  gm.setAttribute('width', majPx);
  gm.setAttribute('height', majPx);
  gm.setAttribute('x', State.panX % majPx);
  gm.setAttribute('y', State.panY % majPx);

  gn.setAttribute('width', minPx);
  gn.setAttribute('height', minPx);

  if (!State.showGrid) {
    rect.setAttribute('fill', '#f0ede8');
  } else {
    rect.setAttribute('fill', 'url(#grid-major)');
  }
}

// ── Tile fills ──────────────────────────────────────────────────────────────
// Repeating square/hex tiles laid inside a closed room, clipped to its polygon.
// A grout backing rect shows the gaps and doubles as a full-room hit target so
// the pattern can be dragged from anywhere inside the room.
const GROUT_COLOR = '#c9c4bb';

function renderTiles() {
  const layer = document.getElementById('layer-tiles');
  layer.innerHTML = '';

  for (const tf of State.tilefills) {
    if (!tf.roomPoly || tf.roomPoly.length < 3) continue;
    drawTileFill(layer, tf);
  }
}

// SVG path data for one cell's world-coord polygon, converted to screen.
function cellPathD(worldPts) {
  let d = '';
  for (let i = 0; i < worldPts.length; i++) {
    const s = toScreen(worldPts[i].x, worldPts[i].y);
    d += (i === 0 ? 'M' : 'L') + s.x + ' ' + s.y;
  }
  return d + 'Z';
}

// Path data covering just the painted (accent) cells of a fill.
function accentPathD(tf) {
  let d = '';
  const painted = tf.painted || {};
  for (const key in painted) {
    if (!painted[key]) continue;
    const [c, r] = key.split(',').map(Number);
    d += cellPathD(tileCellPolygon(tf, c, r));
  }
  return d;
}

// Performance: each fill is drawn as just two <path> elements (all base tiles,
// then painted tiles on top) plus a backing rect — a handful of DOM nodes
// instead of one polygon per tile. Per-cell hit-testing is done mathematically
// (tileCellAt), so the DOM node count stays tiny even for 1" tiles.
function drawTileFill(layer, tf) {
  const clipId = `tileclip-${tf.id}`;
  const clip = makeSVGEl('clipPath', { id: clipId, clipPathUnits: 'userSpaceOnUse' });
  const ptsAttr = tf.roomPoly.map(p => { const s = toScreen(p.x, p.y); return `${s.x},${s.y}`; }).join(' ');
  clip.appendChild(makeSVGEl('polygon', { points: ptsAttr }));
  layer.appendChild(clip);

  const { cells, bbox, truncated } = tileFillCells(tf);
  if (!bbox) return;

  const a = toScreen(bbox.minX, bbox.minY);
  const b = toScreen(bbox.maxX, bbox.maxY);
  const bx = Math.min(a.x, b.x), by = Math.min(a.y, b.y);
  const bw = Math.abs(b.x - a.x), bh = Math.abs(b.y - a.y);

  // Furniture marked "no flooring beneath" cut holes in the fill via a mask
  // (white = keep tile, black = no tile).
  const excluded = State.furniture.filter(f => f.noFloor);
  const maskAttr = {};
  if (excluded.length) {
    const maskId = `tilemask-${tf.id}`;
    const mask = makeSVGEl('mask', { id: maskId, maskUnits: 'userSpaceOnUse' });
    mask.appendChild(makeSVGEl('rect', { x: bx, y: by, width: bw, height: bh, fill: 'white' }));
    for (const f of excluded) mask.appendChild(furnitureMaskShape(f, 'black'));
    layer.appendChild(mask);
    maskAttr.mask = `url(#${maskId})`;
  }

  // Grout backing rect (clipped) — fills gaps and is the full-room hit target.
  layer.appendChild(makeSVGEl('rect', {
    x: bx, y: by, width: bw, height: bh,
    fill: GROUT_COLOR, 'clip-path': `url(#${clipId})`, ...maskAttr,
    'data-type': 'tile', 'data-id': tf.id, style: 'cursor:move',
  }));

  // All tiles as one base path; the per-tile subpath strokes read as grout lines.
  let baseD = '';
  for (const cell of cells) baseD += cellPathD(cell.pts);
  layer.appendChild(makeSVGEl('path', {
    d: baseD, fill: tf.baseColor, class: 'tile-cell',
    'clip-path': `url(#${clipId})`, ...maskAttr, 'data-type': 'tile', 'data-id': tf.id,
  }));

  // Painted tiles on top (pointer-events off so clicks fall through to the base
  // path, which carries the data-id for hit-testing).
  layer.appendChild(makeSVGEl('path', {
    id: `tileaccent-${tf.id}`, d: accentPathD(tf), fill: tf.accentColor,
    class: 'tile-cell', 'clip-path': `url(#${clipId})`, ...maskAttr, 'pointer-events': 'none',
  }));

  if (truncated) setHint('Tile too small for this room — pattern truncated. Increase tile size.');
}

// SVG shape (screen coords) outlining a furniture item, for the tile mask.
function furnitureMaskShape(f, fill) {
  const c = toScreen(f.x, f.y);
  const w = f.width * State.scale, h = f.height * State.scale, rot = f.rotation || 0;
  if (f.type === 'circle') {
    return makeSVGEl('ellipse', { cx: c.x, cy: c.y, rx: w / 2, ry: h / 2, fill, transform: `rotate(${rot} ${c.x} ${c.y})` });
  }
  return makeSVGEl('rect', { x: c.x - w / 2, y: c.y - h / 2, width: w, height: h, fill, transform: `rotate(${rot} ${c.x} ${c.y})` });
}

// Fast in-place update of just the accent path (used while painting in mosaic
// mode so we never rebuild the whole scene).
function repaintTileAccent(tf) {
  const el = document.getElementById(`tileaccent-${tf.id}`);
  if (el) el.setAttribute('d', accentPathD(tf));
}

// Ghost preview of a copied mosaic design at the cursor, before stamping.
function renderMosaicGhost(layer, fillId, e) {
  const tf = State.getTileFill(fillId);
  const stamp = State.tileStamp;
  if (!tf || !stamp) return;
  const { c: tc, r: tr } = stampOrigin(tf, e);
  for (const key of stamp.set) {
    const [dc, dr] = key.split(',').map(Number);
    const pts = tileCellPolygon(tf, tc + dc, tr + dr)
      .map(p => { const s = toScreen(p.x, p.y); return `${s.x},${s.y}`; }).join(' ');
    layer.appendChild(makeSVGEl('polygon', {
      points: pts, fill: tf.accentColor, 'fill-opacity': 0.5,
      stroke: '#fff', 'stroke-width': 0.75, 'pointer-events': 'none',
    }));
  }
}

// ── Walls ─────────────────────────────────────────────────────────────────
function renderWalls() {
  const layer = document.getElementById('layer-walls');
  layer.innerHTML = '';

  for (const w of State.walls) {
    drawWall(layer, w);
  }

  // Fill corner gaps left by butt linecap: draw a solid square at every endpoint
  // that is shared by two or more walls.
  const epMap = {};
  for (const w of State.walls) {
    const t = w.thickness ?? 0.5;
    for (const ep of [{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }]) {
      const key = `${Math.round(ep.x * 1e4)},${Math.round(ep.y * 1e4)}`;
      if (!epMap[key]) epMap[key] = { ep, count: 0, maxT: 0 };
      epMap[key].count++;
      epMap[key].maxT = Math.max(epMap[key].maxT, t);
    }
  }
  for (const { ep, count, maxT } of Object.values(epMap)) {
    if (count < 2) continue;
    const c = toScreen(ep.x, ep.y);
    const half = (maxT / 2) * State.scale;
    layer.appendChild(makeSVGEl('rect', {
      x: c.x - half, y: c.y - half, width: half * 2, height: half * 2,
      fill: '#2c2c2c', stroke: 'none', 'pointer-events': 'none',
    }));
  }
}

function drawWall(layer, w) {
  const p1 = toScreen(w.x1, w.y1);
  const p2 = toScreen(w.x2, w.y2);
  const thickPx = (w.thickness ?? 0.5) * State.scale;
  // 0-thickness walls render as a hairline so they stay visible.
  const strokePx = Math.max(thickPx, 1.5);

  const line = makeSVGEl('line', {
    x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
    'stroke-width': strokePx,
    class: 'wall-line',
    'data-id': w.id,
    'data-type': 'wall',
  });
  layer.appendChild(line);

  // Invisible hit area
  const hit = makeSVGEl('line', {
    x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
    'stroke-width': Math.max(thickPx + 8, 14),
    stroke: 'transparent',
    fill: 'none',
    'data-id': w.id,
    'data-type': 'wall',
    style: 'cursor:pointer',
  });
  layer.appendChild(hit);
}

// ── Openings ──────────────────────────────────────────────────────────────
function renderOpenings() {
  const layer = document.getElementById('layer-openings');
  layer.innerHTML = '';

  for (const o of State.openings) {
    const w = State.getWall(o.wallId);
    if (!w) continue;
    if (o.type === 'door') drawDoor(layer, o, w);
    else drawWindow(layer, o, w);
  }
}

function openingGeom(o, w) {
  const L = wallLength(w);
  const { ux, uy, nx, ny } = wallDir(w);
  const thick = (w.thickness ?? 0.5);
  const halfW = o.width / 2;
  const cWorld = wallPoint(w, o.t);

  // endpoints of the opening in world coords
  const a = { x: cWorld.x - halfW * ux, y: cWorld.y - halfW * uy };
  const b = { x: cWorld.x + halfW * ux, y: cWorld.y + halfW * uy };

  return { a, b, cWorld, ux, uy, nx, ny, thick };
}

function drawDoor(layer, o, w) {
  const { a, b, nx, ny, thick } = openingGeom(o, w);
  const thickPx = thick * State.scale;

  // Gap in wall
  const pa = toScreen(a.x, a.y);
  const pb = toScreen(b.x, b.y);
  layer.appendChild(makeSVGEl('line', {
    x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y,
    'stroke-width': thickPx + 2, class: 'opening-gap',
  }));

  // Invisible wider hit target for the gap area
  layer.appendChild(makeSVGEl('line', {
    x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y,
    'stroke-width': thickPx + 10, stroke: 'transparent',
    'data-id': o.id, 'data-type': 'opening', style: 'cursor:pointer',
  }));

  // Resolve hinge/swing from both old (swing:'left'|'right') and new model
  const hinge_side = o.hinge || (o.swing === 'right' ? 'right' : 'left');
  const swingDir   = o.swingDir || 'in';

  if (swingDir === 'none') return; // opening only — just the gap

  const swingSign = swingDir === 'out' ? -1 : 1;
  const hinge     = hinge_side === 'left' ? a : b;
  const closedEnd = hinge_side === 'left' ? b : a;

  // Open tip = rotate closed end 90° around hinge toward the swingSign normal
  const openTip = {
    x: hinge.x + swingSign * o.width * nx,
    y: hinge.y + swingSign * o.width * ny,
  };

  const ph = toScreen(hinge.x,    hinge.y);
  const pc = toScreen(closedEnd.x, closedEnd.y);
  const po = toScreen(openTip.x,  openTip.y);

  // Door panel (open position)
  layer.appendChild(makeSVGEl('line', {
    x1: ph.x, y1: ph.y, x2: po.x, y2: po.y, class: 'door-panel',
  }));

  // Swing arc — always draw the short arc (≤ 180°)
  const r = o.width * State.scale;
  const closedAngle = Math.atan2(pc.y - ph.y, pc.x - ph.x) * 180 / Math.PI;
  const openAngle   = Math.atan2(po.y - ph.y, po.x - ph.x) * 180 / Math.PI;
  // Clockwise span from closed to open; if > 180 the short arc goes the other way
  let cwSpan = openAngle - closedAngle;
  if (cwSpan < 0) cwSpan += 360;
  const startA = cwSpan <= 180 ? closedAngle : openAngle;
  const endA   = cwSpan <= 180 ? openAngle   : closedAngle;

  layer.appendChild(makeSVGEl('path', {
    d: svgArc(ph.x, ph.y, r, startA, endA),
    class: 'door-arc',
    'data-id': o.id, 'data-type': 'opening', style: 'cursor:pointer',
  }));
}

function drawWindow(layer, o, w) {
  const { a, b, nx, ny, thick } = openingGeom(o, w);
  const thickPx = thick * State.scale;

  const pa = toScreen(a.x, a.y);
  const pb = toScreen(b.x, b.y);

  // Gap
  const gap = makeSVGEl('line', {
    x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y,
    'stroke-width': thickPx + 2,
    class: 'opening-gap',
  });
  layer.appendChild(gap);

  // Invisible hit target
  layer.appendChild(makeSVGEl('line', {
    x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y,
    'stroke-width': thickPx + 10, stroke: 'transparent',
    'data-id': o.id, 'data-type': 'opening', style: 'cursor:pointer',
  }));

  // Triple line window symbol
  const offsets = [-thick * 0.3, 0, thick * 0.3];
  for (const off of offsets) {
    const wa = toScreen(a.x + off * nx, a.y + off * ny);
    const wb = toScreen(b.x + off * nx, b.y + off * ny);
    const line = makeSVGEl('line', {
      x1: wa.x, y1: wa.y, x2: wb.x, y2: wb.y,
      class: 'window-glass',
      'stroke-width': off === 0 ? 2 : 1,
      'data-id': o.id,
      'data-type': 'opening',
      style: 'cursor:pointer',
    });
    layer.appendChild(line);
  }
}

// ── Furniture ─────────────────────────────────────────────────────────────
function renderFurniture() {
  const layer = document.getElementById('layer-furniture');
  layer.innerHTML = '';

  for (const f of State.furniture) {
    drawFurniture(layer, f);
  }
}

function drawFurniture(layer, f) {
  const c = toScreen(f.x, f.y);
  const w = f.width * State.scale;
  const h = f.height * State.scale;
  const rot = f.rotation || 0;

  const g = makeSVGEl('g', {
    transform: `translate(${c.x},${c.y}) rotate(${rot})`,
    'data-id': f.id,
    'data-type': 'furniture',
    style: 'cursor:move',
  });

  // Per-item color as inline style (inline beats the CSS class defaults).
  const col = furnColors(f);
  const paint = `fill:${col.fill};stroke:${col.stroke}`;
  if (f.type === 'circle') {
    const rx = w / 2, ry = h / 2;
    const shape = makeSVGEl('ellipse', {
      cx: 0, cy: 0, rx, ry, class: 'furn-circle', style: paint,
    });
    g.appendChild(shape);
  } else {
    const shape = makeSVGEl('rect', {
      x: -w / 2, y: -h / 2, width: w, height: h, class: 'furn-rect',
      rx: 3, ry: 3, style: paint,
    });
    g.appendChild(shape);
  }

  if (f.label) {
    const txt = makeSVGEl('text', { x: 0, y: 0, class: 'furn-label', style: `fill:${col.text}` });
    txt.textContent = f.label;
    g.appendChild(txt);
  }

  layer.appendChild(g);
}

// ── Labels ────────────────────────────────────────────────────────────────
function renderLabels() {
  const layer = document.getElementById('layer-labels');
  layer.innerHTML = '';
  for (const lbl of State.labels) {
    const sc = toScreen(lbl.x, lbl.y);
    const fsPx = lbl.fontSize * State.scale;
    const hw = fsPx * 0.55 * (lbl.text.length || 1) / 2;
    const hh = fsPx * 0.6;

    layer.appendChild(makeSVGEl('rect', {
      x: sc.x - hw, y: sc.y - hh, width: hw * 2, height: hh * 2,
      fill: 'transparent', stroke: 'none',
      'data-type': 'label', 'data-id': lbl.id, style: 'cursor:move',
    }));

    const txt = makeSVGEl('text', { x: sc.x, y: sc.y, class: 'label-text', 'font-size': fsPx });
    txt.textContent = lbl.text;
    layer.appendChild(txt);

    if (State.selected?.type === 'label' && State.selected.id === lbl.id) {
      layer.appendChild(makeSVGEl('rect', {
        x: sc.x - hw - 3, y: sc.y - hh - 3, width: hw * 2 + 6, height: hh * 2 + 6,
        class: 'selection-box',
      }));
      layer.appendChild(makeSVGEl('rect', {
        x: sc.x + hw - 4, y: sc.y + hh - 4, width: 8, height: 8,
        class: 'handle', 'data-drag': 'resize',
      }));
    }
  }
}

// ── Dimensions ────────────────────────────────────────────────────────────
function renderDimensions() {
  const layer = document.getElementById('layer-dimensions');
  layer.innerHTML = '';
  if (!State.showDimensions) return;

  for (const w of State.walls) {
    drawWallDimension(layer, w);
  }

  // Outer-overall dims are drawn per collinear run so split walls read as one.
  for (const run of wallRuns()) {
    drawRunOuterDimension(layer, run);
  }

  for (const f of State.furniture) {
    drawFurnitureDimension(layer, f);
  }
}

// Returns true when an endpoint is sandwiched between rooms — either connecting
// walls span both sides of this wall's normal, or the endpoint Ts into the
// middle of another wall (which always spans both sides).
function isInteriorPartition(w) {
  const { nx, ny } = wallDir(w);
  for (const ep of [{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }]) {
    // Endpoint lands mid-span on another wall → that host spans both sides.
    for (const wa of State.walls) {
      if (wa.id === w.id) continue;
      const r = nearestOnWall(wa, ep.x, ep.y);
      if (r.dist < 0.05 && r.t > 0.02 && r.t < 0.98) return true;
    }
    const adj = wallsAt(ep.x, ep.y, w.id);
    if (adj.length < 2) continue;
    const hasPos = adj.some(({ ax, ay }) => ax * nx + ay * ny >  0.1);
    const hasNeg = adj.some(({ ax, ay }) => ax * nx + ay * ny < -0.1);
    if (hasPos && hasNeg) return true;
  }
  return false;
}

// Draw small dims showing gap from each inner wall face to nearest opening edge.
// Runs at `offset` distance from the wall centerline (on the normal-positive side).
function drawOpeningCallouts(layer, w, d1, d2, offset) {
  const openingsOnWall = State.openings.filter(o => o.wallId === w.id);
  if (!openingsOnWall.length) return;

  const L = wallLength(w);
  const { ux, uy, nx, ny } = wallDir(w);
  const startPos = d1;
  const endPos   = L - d2;

  const sorted = [...openingsOnWall].sort((a, b) => a.t - b.t);

  // Collect gap segments: spans between inner wall faces and opening edges
  const gaps = [];
  let pos = startPos;
  for (const o of sorted) {
    const halfW = o.width / 2;
    const leftEdge  = o.t * L - halfW;
    const rightEdge = o.t * L + halfW;
    const gapEnd = clamp(leftEdge, pos, endPos);
    if (gapEnd - pos > 0.05) gaps.push({ from: pos, to: gapEnd });
    pos = Math.max(pos, Math.min(rightEdge, endPos));
  }
  if (endPos - pos > 0.05) gaps.push({ from: pos, to: endPos });

  for (const seg of gaps) {
    const b1 = { x: w.x1 + seg.from * ux, y: w.y1 + seg.from * uy };
    const b2 = { x: w.x1 + seg.to   * ux, y: w.y1 + seg.to   * uy };
    const p1 = { x: b1.x + nx * offset,   y: b1.y + ny * offset };
    const p2 = { x: b2.x + nx * offset,   y: b2.y + ny * offset };
    dimExtLine(layer, b1, p1, 'dim-ext');
    dimExtLine(layer, b2, p2, 'dim-ext');
    const s1 = toScreen(p1.x, p1.y), s2 = toScreen(p2.x, p2.y);
    const mi = { x: (s1.x + s2.x) / 2, y: (s1.y + s2.y) / 2 };
    layer.appendChild(makeSVGEl('line', { x1: s1.x, y1: s1.y, x2: s2.x, y2: s2.y, class: 'dim-line' }));
    dimLabel(layer, mi, fmtFt(seg.to - seg.from), 'dim-text', 38, 14);
  }
}

function drawWallDimension(layer, w) {
  if (w.hideDim) return;
  const L = wallLength(w);
  if (L < 0.1) return;

  const dir = wallDir(w);
  const ux = dir.ux, uy = dir.uy;
  const flip = w.flipDim ? -1 : 1;       // "Swap side" mirrors the dim across the wall
  const nx = dir.nx * flip, ny = dir.ny * flip;
  const thick = w.thickness ?? 0.5;

  const d1 = innerTrimAt(w, w.x1, w.y1);
  const d2 = innerTrimAt(w, w.x2, w.y2);

  // In interior mode, free ends get an assumed half-thickness trim to match
  // the IC the user entered (wall was placed thick longer to account for both ends).
  const assumed = State.interiorMode ? thick / 2 : 0;
  const assumed1 = d1 <= 0.02 ? assumed : 0;
  const assumed2 = d2 <= 0.02 ? assumed : 0;

  const hasOpenings = State.openings.some(o => o.wallId === w.id);

  // When openings are present, callout dims sit at the inner-dim offset and
  // the inner clear dim is pushed further out to avoid overlap.
  const calloutOff = thick * 0.5 + 0.55;
  const innerOff   = thick * 0.5 + (hasOpenings ? 1.1  : 0.55);

  // Inner-clear span between the end connections, split into clear segments
  // wherever a wall Ts into the middle of this wall on the dimension's side.
  const s0 = d1, s1 = L - d2;
  const segs = wallInnerSegments(w, s0, s1);
  for (const s of segs) {
    let len = s.to - s.from;
    if (Math.abs(s.from - s0) < 1e-6) len -= assumed1;   // free-end assumed trim
    if (Math.abs(s.to - s1) < 1e-6) len -= assumed2;
    drawInnerSeg(layer, w, ux, uy, nx, ny, innerOff, s.from, s.to, Math.max(1 / 12, len));
  }

  // Opening location callouts (between inner clear dim and wall face)
  if (hasOpenings) drawOpeningCallouts(layer, w, d1, d2, calloutOff * flip);

  // The secondary outer-overall (gray) dim is drawn once per collinear run of
  // walls (see drawRunOuterDimension), so a wall split into segments still shows
