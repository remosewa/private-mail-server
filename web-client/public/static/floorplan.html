'use strict';

// ── Tool switching ────────────────────────────────────────────────────────
function setTool(name) {
  cancelDraw();
  State.tileStamp = null;   // drop any armed mosaic stamp when changing tools
  State.tool = name;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === name));
  const cc = document.getElementById('canvas-container');
  cc.className = '';
  cc.classList.add(`tool-${name}`);
  document.getElementById('status-tool').textContent = `Tool: ${name.charAt(0).toUpperCase() + name.slice(1)}`;

  const hints = {
    select: 'Click to select. Drag to move. Double-click to edit. Space+drag or middle-click to pan.',
    wall:   'Click to place wall points. Double-click / Enter to finish chain. Esc to cancel.',
    door:   'Click near a wall to place a door. Space+drag or middle-click to pan.',
    window: 'Click near a wall to place a window. Space+drag or middle-click to pan.',
    rect:   'Click to place a furniture rectangle. Space+drag or middle-click to pan.',
    circle: 'Click to place a furniture circle. Space+drag or middle-click to pan.',
    label:  'Click to place a text label. Space+drag or middle-click to pan.',
    tile:   'Click inside a closed room to lay tile. Select tool to drag the pattern.',
    mosaic: 'Click tiles to recolor. Drag to paint. Shift-drag to copy a design, then click to stamp it.',
  };
  setHint(hints[name] || '');
}

function setHint(msg) { document.getElementById('status-hint').textContent = msg; }

function updateStatusCoords(wp) {
  document.getElementById('status-coords').textContent = `${fmtFt(wp.x)}, ${fmtFt(wp.y)}`;
}

// Distance from the reference point to the cursor, shown in the status bar.
function updateReferenceReadout() {
  const el = document.getElementById('status-ref');
  const ref = State.referencePoint;
  if (!ref) { el.textContent = ''; el.classList.remove('active'); return; }
  const cur = State.rawMouseWorld || State.mouseWorld;
  const dx = cur.x - ref.x;
  const dy = cur.y - ref.y;
  const d = Math.sqrt(dx * dx + dy * dy);
  el.textContent = `📏 ${fmtFt(d)}  (Δx ${fmtFt(Math.abs(dx))}, Δy ${fmtFt(Math.abs(dy))})  ✕`;
  el.classList.add('active');
  renderReference();
}

function updateZoomLabel() {
  document.getElementById('zoom-label').textContent = `${Math.round(State.scale / 40 * 100)}%`;
}

// ── Properties panel ──────────────────────────────────────────────────────
function updatePropertiesPanel() {
  const panel = document.getElementById('properties-panel');
  const title = document.getElementById('prop-title');
  const content = document.getElementById('prop-content');

  // Multiple items selected — show a group summary instead of per-field editing
  if (State.selection.length > 1) {
    panel.classList.remove('hidden');
    title.textContent = `${State.selection.length} items selected`;
    content.innerHTML =
      '<div style="font-size:12px;color:#88a;line-height:1.5">' +
      'Drag any selected item to move the group.<br>' +
      'Ctrl/Cmd+C to copy · Ctrl/Cmd+V to paste · Del to remove.<br>' +
      'Shift-click to add/remove items.</div>';
    return;
  }

  if (!State.selected) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');

  const { type, id } = State.selected;

  if (type === 'wall') {
    const w = State.getWall(id);
    if (!w) { panel.classList.add('hidden'); return; }
    title.textContent = 'Wall';
    content.innerHTML = '';
    const L = wallLength(w);
    const d1 = innerTrimAt(w, w.x1, w.y1);
    const d2 = innerTrimAt(w, w.x2, w.y2);
    const innerLen = L - d1 - d2;
    const outerLen = L + d1 + d2;
    const hasAdj = d1 > 0.01 || d2 > 0.01;
    addPropRow(content, 'Inner clear', fmtFt(hasAdj ? innerLen : L), val => {
      const v = parseFt(val);
      if (v > 0) {
        Undo.push();
        // Keep P1 fixed, move P2 — connected walls at P2 follow along.
        const newCenterline = v + d1 + d2;
        const { ux, uy } = wallDir(w);
        moveWallEnd(w, 2, w.x1 + newCenterline * ux, w.y1 + newCenterline * uy);
        render();
        updatePropertiesPanel();
      }
    });
    if (hasAdj) addPropRow(content, 'Overall', fmtFt(outerLen), null, true);
    addPropRow(content, 'Angle', fmtAngle(wallAngleDeg(w)), null, true);
    addPropRow(content, 'Thickness', fmtFt(w.thickness), val => {
      const v = parseFt(val);
      if (v >= 0) { w.thickness = v; render(); }
    });
    addPropSelect(content, 'Dimension', w.hideDim ? 'hide' : 'show',
      [['show', 'Show'], ['hide', 'Hide'], ['swap', 'Swap side']],
      val => {
        if (val === 'swap') { w.flipDim = !w.flipDim; w.hideDim = false; render(); updatePropertiesPanel(); }
        else { w.hideDim = val === 'hide'; render(); }
      });

  } else if (type === 'opening') {
    const o = State.getOpening(id);
    if (!o) { panel.classList.add('hidden'); return; }
    title.textContent = o.type === 'door' ? '🚪 Door' : '🪟 Window';
    content.innerHTML = '';
    addPropRow(content, 'Width', fmtFt(o.width), val => {
      const v = parseFt(val);
      if (v >= 0.5) { o.width = v; render(); }
    });
    if (o.type === 'door') {
      addPropSelect(content, 'Hinge', o.hinge || 'left',
        [['left', 'Left'], ['right', 'Right']],
        val => { o.hinge = val; render(); });
      addPropSelect(content, 'Swing', o.swingDir || 'in',
        [['in', 'Inswing'], ['out', 'Outswing'], ['none', 'Opening only']],
        val => { o.swingDir = val; render(); });
    }
    addPropRow(content, 'Label', o.label || '', val => { o.label = val; });

  } else if (type === 'furniture') {
    const f = State.getFurniture(id);
    if (!f) { panel.classList.add('hidden'); return; }
    title.textContent = f.type === 'circle' ? 'Furniture (Oval)' : 'Furniture (Rect)';
    content.innerHTML = '';
    addPropRow(content, 'Width', fmtFt(f.width), val => {
      const v = parseFt(val);
      if (v >= 0.25) { f.width = v; render(); }
    });
    addPropRow(content, 'Height', fmtFt(f.height), val => {
      const v = parseFt(val);
      if (v >= 0.25) { f.height = v; render(); }
    });
    addPropRow(content, 'Rotation °', f.rotation || 0, val => {
      f.rotation = parseFloat(val) || 0; render();
    });
    addPropRow(content, 'Label', f.label || '', val => { f.label = val; render(); });
    addPropColor(content, 'Color', f.color || FURN_DEFAULT_COLOR, val => { f.color = val; render(); });
    addPropCheckbox(content, 'No flooring beneath', !!f.noFloor, checked => {
      Undo.push(); f.noFloor = checked; render();
    });

  } else if (type === 'label') {
    const lbl = State.getLabel(id);
    if (!lbl) { panel.classList.add('hidden'); return; }
    title.textContent = 'Label';
    content.innerHTML = '';
    addPropRow(content, 'Text', lbl.text, val => {
      const t = val.trim(); if (t) { lbl.text = t; render(); }
    });
    addPropRow(content, 'Font size (ft)', lbl.fontSize, val => {
      const v = parseFloat(val); if (v >= 0.1) { lbl.fontSize = v; render(); }
    });

  } else if (type === 'tile') {
    const tf = State.getTileFill(id);
    if (!tf) { panel.classList.add('hidden'); return; }
    title.textContent = tf.shape === 'hex' ? 'Tile (Hex)' : 'Tile (Square)';
    content.innerHTML = '';
    const refresh = () => { render(); updatePropertiesPanel(); };
    addPropSelect(content, 'Tile type', tf.shape,
      [['square', '4-sided (square/rect)'], ['hex', '6-sided (hexagon)']],
      val => {
        Undo.push();
        tf.shape = val === 'hex' ? 'hex' : 'square';
        if (tf.shape === 'hex') tf.tileH = tf.tileW;
        refresh();
      });
    if (tf.shape === 'hex') {
      addPropRow(content, 'Tile side', fmtFt(tf.tileW), val => {
        const v = parseFt(val); if (v > 0) { tf.tileW = v; refresh(); }
      });
    } else {
      addPropRow(content, 'Tile length', fmtFt(tf.tileW), val => {
        const v = parseFt(val); if (v > 0) { tf.tileW = v; refresh(); }
      });
      addPropRow(content, 'Tile width', fmtFt(tf.tileH), val => {
        const v = parseFt(val); if (v > 0) { tf.tileH = v; refresh(); }
      });
    }
    addPropSelect(content, 'Grout / ground', groutOptionValue(tf.grout),
      GROUT_OPTIONS.map(o => [String(o.ft), o.label]),
      val => { tf.grout = parseFloat(val) || 0; refresh(); });
    addPropColor(content, 'Base color', tf.baseColor, val => { tf.baseColor = val; render(); });
    addPropColor(content, 'Accent color', tf.accentColor, val => { tf.accentColor = val; render(); });
    addPropRow(content, 'Offset', `${fmtFt(tf.offsetX || 0)}, ${fmtFt(tf.offsetY || 0)}`, null, true);

    // Area breakdown
    const stats = tileFillStats(tf);
    const groutArea = Math.max(0, stats.floorArea - stats.baseArea - stats.accentArea);
    const helpText = 'Base and Accent show only actual tile material, so they don’t add up to the room area. ' +
      'The remainder is grout (the gaps between tiles) plus tile edges hidden under the walls. ' +
      'In short: room interior = base + accent + grout.';
    const div = document.createElement('div');
    div.className = 'tile-stats';
    const line = (lbl, val, swatch) => {
      const sw = swatch ? `<span class="stat-swatch" style="background:${swatch}"></span>` : '';
      return `<div class="stat-row"><span>${sw}${lbl}</span><span>${val}</span></div>`;
    };
    let html = `<div class="stat-head">Area breakdown <button class="info-btn" title="${helpText}" aria-label="What do these areas mean?">i</button></div>`;
    html += `<div class="tile-stats-help" hidden>${helpText}</div>`;
    html += line('Room area (interior)', fmtArea(stats.interiorArea));
    if (stats.hasExclusions) {
      html += line('After furniture exclusions', fmtArea(stats.floorArea));
      html += line('Excluded (no flooring)', fmtArea(stats.exclArea));
    }
    html += line('Base color tile', fmtArea(stats.baseArea), tf.baseColor);
    html += line('Accent color tile', fmtArea(stats.accentArea), tf.accentColor);
    html += line('Grout', fmtArea(groutArea));
    div.innerHTML = html;
    content.appendChild(div);
    const infoBtn = div.querySelector('.info-btn');
    const helpDiv = div.querySelector('.tile-stats-help');
    infoBtn.addEventListener('click', () => { helpDiv.hidden = !helpDiv.hidden; });

    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'Clear painting';
    clearBtn.style.cssText = 'margin-top:6px;padding:5px 10px;background:#1a1a2e;border:1px solid #0f3460;border-radius:4px;color:#aac;font-size:12px;cursor:pointer;width:100%';
    clearBtn.addEventListener('click', () => { Undo.push(); tf.painted = {}; render(); });
    content.appendChild(clearBtn);

    const note = document.createElement('div');
    note.style.cssText = 'margin-top:6px;font-size:11px;color:#88a;line-height:1.5';
    note.innerHTML =
      'With the <b>Mosaic</b> tool:<br>' +
      '• Click a tile to paint it the accent color; drag to paint several.<br>' +
      '• <b>Shift-drag</b> a box to copy a design.<br>' +
      '• Then <b>click to stamp</b> (repeat) it; <b>Esc</b> to cancel.';
    content.appendChild(note);
  }
}

// Color swatch row for the properties panel.
function addPropColor(container, label, value, onChange) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('label');
  lbl.textContent = label;
  const input = document.createElement('input');
  input.type = 'color';
  input.value = value || '#f6f3ee';
  input.addEventListener('input', () => onChange(input.value));
  input.addEventListener('change', () => onChange(input.value));
  // Safety net: some native dialogs can commit the value without dispatching
  // events. While the picker is open, watch the value and apply silent commits.
  let lastSeen = input.value;
  input.addEventListener('input', () => { lastSeen = input.value; });
  input.addEventListener('click', () => {
    let n = 0;
    const iv = setInterval(() => {
      if (!input.isConnected) { clearInterval(iv); return; }
      if (input.value !== lastSeen) {
        lastSeen = input.value;
        onChange(input.value);
      }
      if (++n >= 60) clearInterval(iv);   // watch for 30s
    }, 500);
  });
  row.appendChild(lbl);
  row.appendChild(input);
  container.appendChild(row);
}

function addPropRow(container, label, value, onChange, readonly = false) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('label');
  lbl.textContent = label;
  const input = document.createElement('input');
  input.value = value;
  if (readonly) {
    input.readOnly = true;
  } else if (onChange) {
    const apply = () => { onChange(input.value); };
    input.addEventListener('blur', apply);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); apply(); input.blur(); } });
  }
  row.appendChild(lbl);
  row.appendChild(input);
  container.appendChild(row);
}

function addPropSelect(container, label, value, options, onChange) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('label');
  lbl.textContent = label;
  const sel = document.createElement('select');
  for (const [v, t] of options) {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = t;
    if (v === value) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', e => onChange(e.target.value));
  row.appendChild(lbl);
  row.appendChild(sel);
  container.appendChild(row);
}

function addPropCheckbox(container, label, checked, onChange) {
  const row = document.createElement('div');
  row.className = 'prop-row';
  const lbl = document.createElement('label');
  lbl.textContent = label;
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.checked = !!checked;
  input.style.cssText = 'width:auto;flex:0 0 auto';
  input.addEventListener('change', () => onChange(input.checked));
  row.appendChild(lbl);
  row.appendChild(input);
  container.appendChild(row);
}

// ── Modals ────────────────────────────────────────────────────────────────
function showModal(title, fields, onOk) {
  document.getElementById('modal-title').textContent = title;
  const body = document.getElementById('modal-body');
  body.innerHTML = '';

  const inputs = {};
  for (const f of fields) {
    const div = document.createElement('div');
    div.className = 'modal-field';
    const lbl = document.createElement('label');
    lbl.textContent = f.label;
    div.appendChild(lbl);

    let input;
    if (f.type === 'select') {
      input = document.createElement('select');
      for (const opt of f.options) {
        const o = document.createElement('option');
        o.value = opt.value; o.textContent = opt.label;
        if (opt.value === f.value) o.selected = true;
        input.appendChild(o);
      }
    } else if (f.type === 'checkbox') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!f.value;
    } else {
      input = document.createElement('input');
      input.type = f.type || 'text';
      input.value = f.value !== undefined ? f.value : '';
      input.placeholder = f.placeholder || '';
    }
    input.id = `modal-field-${f.key}`;
    inputs[f.key] = input;
    div.appendChild(input);
    body.appendChild(div);
  }

  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('hidden');

  const ok = document.getElementById('modal-ok');
  const cancel = document.getElementById('modal-cancel');

  const cleanup = () => {
    overlay.classList.add('hidden');
    ok.removeEventListener('click', handleOk);
    cancel.removeEventListener('click', cleanup);
    document.removeEventListener('keydown', handleKey);
  };

  const handleOk = () => {
    const vals = {};
    for (const [k, el] of Object.entries(inputs)) {
      vals[k] = el.type === 'checkbox' ? el.checked : el.value;
    }
    cleanup();
    onOk(vals);
  };

  const handleKey = e => {
    if (e.key === 'Enter') { e.preventDefault(); handleOk(); }
    if (e.key === 'Escape') cleanup();
  };

  ok.addEventListener('click', handleOk);
  cancel.addEventListener('click', cleanup);
  document.addEventListener('keydown', handleKey);

  const first = body.querySelector('input, select');
  if (first) { first.focus(); if (first.select) first.select(); }
}

function openEditWallModal(id) {
  const w = State.getWall(id);
  if (!w) return;

  // Compute current inner clear so the user sees what they'd measure inside
  const d1 = innerTrimAt(w, w.x1, w.y1);
  const d2 = innerTrimAt(w, w.x2, w.y2);
  const currentInner = wallLength(w) - d1 - d2;

  showModal('Edit Wall', [
    { key: 'innerLen',  label: 'Inner clear length (what you measure inside the room)', value: fmtFt(currentInner) },
    { key: 'thickness', label: 'Wall thickness', value: fmtFt(w.thickness) },
  ], vals => {
    const newInner = parseFt(vals.innerLen);
    const newThick = parseFt(vals.thickness);
    if (newInner > 0 && newThick >= 0) {
      Undo.push();
      // New centerline = desired inner + the trim that connecting walls impose
      // d1 and d2 come from the connecting walls (unchanged), not from this wall
      const newCenterline = newInner + d1 + d2;
      const { ux, uy } = wallDir(w);
      // Keep P1 fixed, move P2 — walls connected at P2 follow so rooms stay closed
      moveWallEnd(w, 2, w.x1 + newCenterline * ux, w.y1 + newCenterline * uy);
      w.thickness = newThick;
      render();
      updatePropertiesPanel();
    }
  });
}

function openEditOpeningModal(id, defaults) {
  const isNew = id === null;
  const o = isNew ? defaults : State.getOpening(id);
  if (!o) return;

  // Compute maximum width that fits within the wall's inner clear
  const wall = State.getWall(o.wallId);
  let maxWidth = Infinity;
  if (wall) {
    const L  = wallLength(wall);
    const d1 = innerTrimAt(wall, wall.x1, wall.y1);
    const d2 = innerTrimAt(wall, wall.x2, wall.y2);
    maxWidth = Math.max(0.5, L - d1 - d2);
  }
  const clampedInitial = Math.min(o.width, maxWidth);

  const baseFields = [
    { key: 'width', label: `Width (max ${fmtFt(maxWidth)})`, value: fmtFt(clampedInitial) },
    { key: 'label', label: 'Label', value: o.label || '' },
  ];

  if (o.type === 'door') {
    baseFields.push({
      key: 'hinge', label: 'Hinge side', type: 'select',
      value: o.hinge || 'left',
      options: [{ value: 'left', label: 'Left' }, { value: 'right', label: 'Right' }],
    });
    baseFields.push({
      key: 'swingDir', label: 'Swing', type: 'select',
      value: o.swingDir || 'in',
      options: [
        { value: 'in',   label: 'Inswing (opens into room)' },
        { value: 'out',  label: 'Outswing (opens outward)' },
        { value: 'none', label: 'Opening only (no panel)' },
      ],
    });
  }

  const typeLabel = o.type === 'door' ? '🚪 Door' : '🪟 Window';
  showModal(isNew ? `Place ${typeLabel}` : `Edit ${typeLabel}`, baseFields, vals => {
    const width = clamp(Math.max(0.5, parseFt(vals.width)), 0.5, maxWidth);
    Undo.push();

    // Re-clamp t so the opening stays within bounds at the new width
    const clampT = (t, wallObj, w) => {
      if (!wallObj) return t;
      const L   = wallLength(wallObj);
      const d1  = innerTrimAt(wallObj, wallObj.x1, wallObj.y1);
      const d2  = innerTrimAt(wallObj, wallObj.x2, wallObj.y2);
      const hw  = w / 2;
      const lo  = clamp((d1 + hw) / L, 0.01, 0.99);
      const hi  = clamp((L - d2 - hw) / L, 0.01, 0.99);
      return clamp(t, lo, Math.max(lo, hi));
    };

    if (isNew) {
      const newT = clampT(o.t, wall, width);
      const newO = {
        id: State.newId(), ...o, t: newT, width,
        label: vals.label,
        hinge: vals.hinge || 'left',
        swingDir: vals.swingDir || 'in',
      };
      State.openings.push(newO);
      State.selected = { type: 'opening', id: newO.id };
    } else {
      o.width = width;
      o.t     = clampT(o.t, wall, width);
      o.label = vals.label;
      if (vals.hinge)    o.hinge    = vals.hinge;
      if (vals.swingDir) o.swingDir = vals.swingDir;
    }

    render();
    updatePropertiesPanel();
  });
}

// ── Tile fill ─────────────────────────────────────────────────────────────
// Standard grout / spacer widths (stored in feet). Grout is always a sub-inch
// fraction, so it's a dropdown rather than a free-typed length.
const GROUT_OPTIONS = [
  { ft: 0,      label: 'None (0")' },
  { ft: 1 / 192, label: '1/16"' },
  { ft: 1 / 96,  label: '1/8"' },
  { ft: 1 / 64,  label: '3/16"' },
  { ft: 1 / 48,  label: '1/4"' },
  { ft: 1 / 32,  label: '3/8"' },
  { ft: 1 / 24,  label: '1/2"' },
];
const DEFAULT_GROUT = 1 / 96; // 1/8"

// String value (for <select>) of the option closest to a grout width in feet.
function groutOptionValue(grout) {
  let best = GROUT_OPTIONS[0], bd = Infinity;
  for (const o of GROUT_OPTIONS) { const d = Math.abs(o.ft - (grout || 0)); if (d < bd) { bd = d; best = o; } }
  return String(best.ft);
}
function groutSelectOptions() {
  return GROUT_OPTIONS.map(o => ({ value: String(o.ft), label: o.label }));
}
function groutLabel(grout) {
  const v = groutOptionValue(grout);
  return (GROUT_OPTIONS.find(o => String(o.ft) === v) || GROUT_OPTIONS[0]).label;
}

// poly is the room polygon (for a new fill). When `id` is given, edit in place.
function openTileFillModal(poly, id) {

  // dialog's gradient box can only ever re-produce white (luminosity is maxed),

  const tf = isNew
    ? { shape: 'square', tileW: 0.25, tileH: 0.25, grout: DEFAULT_GROUT, baseColor: '#f6f3ee', accentColor: '#1a1a1a' }

  showModal(isNew ? 'Lay Tile' : 'Edit Tile', [
    {
      key: 'shape', label: 'Tile type', type: 'select', value: tf.shape,

        { value: 'square', label: '4-sided (square / rectangle)' },
        { value: 'hex',    label: '6-sided (hexagon)' },
      ],
    },
    { key: 'tileW', label: 'Tile length / side', value: fmtFt(tf.tileW) },
    { key: 'tileH', label: 'Tile width (4-sided only)', value: fmtFt(tf.tileH) },
    { key: 'grout', label: 'Grout / ground width', type: 'select',

  ], vals => {
    const shape = vals.shape === 'hex' ? 'hex' : 'square';
    const tileW = Math.max(1 / 24, parseFt(vals.tileW));      // >= 0.5"

    const grout = Math.max(0, parseFloat(vals.grout) || 0);

// ===== save.js =====
// ── Save / Load ───────────────────────────────────────────────────────────
// When the File System Access API is available (Chromium), we remember the
// chosen file and overwrite it on subsequent saves — no pile of duplicate
// downloads. Other browsers fall back to a timestamped download name.

let fileHandle = null;        // FileSystemFileHandle once a file is chosen
let lastFileName = 'floorplan.fpd';
const FS_SUPPORTED = typeof window !== 'undefined' && 'showSaveFilePicker' in window;
const FPD_TYPES = [{ description: 'Floor Plan', accept: { 'application/json': ['.fpd'] } }];

function timestampedName() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `floorplan-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.fpd`;
}

async function saveProject() {
  const json = State.toJSON();
  if (FS_SUPPORTED) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({ suggestedName: lastFileName, types: FPD_TYPES });
        lastFileName = fileHandle.name;
      }
      const writable = await fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
      setHint(`Saved to ${fileHandle.name}.`);
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // user cancelled the picker
      // Anything else: fall back to a normal download below.
    }
  }
  downloadProject(json);
}

// "Save As" — forget the current file so the picker (or a fresh download) runs.
async function saveProjectAs() {
  fileHandle = null;
  await saveProject();
}

function downloadProject(json) {
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = timestampedName();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setHint(`Saved ${a.download}.`);
}

function applyLoadedJSON(text, name) {
  try {
    State.fromJSON(text);
    render();
    updatePropertiesPanel();
    updateZoomLabel();
    if (name) setHint(`Opened ${name}.`);
  } catch (err) {
    alert('Failed to load file: ' + err.message);
  }
}

// Open a project. With the File System Access API this also captures the handle,
// so a later Save overwrites the file you opened.
async function openProject() {
  if (FS_SUPPORTED) {
    try {
      const [handle] = await window.showOpenFilePicker({ types: FPD_TYPES });
      fileHandle = handle;
      lastFileName = handle.name;
      const file = await handle.getFile();
      applyLoadedJSON(await file.text(), handle.name);
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      // fall through to the input-based loader
    }
  }
  document.getElementById('file-input').click();
}

// Fallback loader (hidden <input type=file>) for browsers without the FS API.
function loadProject(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  fileHandle = null;            // input files aren't writable; saves will download
  lastFileName = file.name || lastFileName;
  const reader = new FileReader();
  reader.onload = ev => applyLoadedJSON(ev.target.result, file.name);
  reader.readAsText(file);
}

// ── Export PNG ────────────────────────────────────────────────────────────

function exportPNG() {
  // Collect bounds from all elements
  const pts = [];
  for (const w of State.walls) {
    pts.push({ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 });
  }
  for (const f of State.furniture) {
    const hw = f.width / 2, hh = f.height / 2;
    pts.push(
      { x: f.x - hw, y: f.y - hh }, { x: f.x + hw, y: f.y + hh },
      { x: f.x - hw, y: f.y + hh }, { x: f.x + hw, y: f.y - hh },
    );
  }
  for (const lbl of State.labels) {
    const hw = lbl.fontSize * 0.55 * (lbl.text.length || 1) / 2;
    const hh = lbl.fontSize * 0.6;
    pts.push({ x: lbl.x - hw, y: lbl.y - hh }, { x: lbl.x + hw, y: lbl.y + hh });
  }
  for (const tf of State.tilefills) {
    for (const p of (tf.roomPoly || [])) pts.push({ x: p.x, y: p.y });
  }

  if (pts.length === 0) { alert('Nothing to export.'); return; }

  const margin = 2.5; // feet
  const minX = Math.min(...pts.map(p => p.x)) - margin;
  const minY = Math.min(...pts.map(p => p.y)) - margin;
  const maxX = Math.max(...pts.map(p => p.x)) + margin;
  const maxY = Math.max(...pts.map(p => p.y)) + margin;

  const exportScale = 72; // px per foot (high res)
  const width = Math.round((maxX - minX) * exportScale);
  const height = Math.round((maxY - minY) * exportScale);

  // Temporarily override pan/scale to render clean export
  const savedPan = { x: State.panX, y: State.panY, s: State.scale };
  State.panX = -minX * exportScale;
  State.panY = -minY * exportScale;
  State.scale = exportScale;

  // Clone SVG
  const svgEl = document.getElementById('canvas');
  const clone = svgEl.cloneNode(true);

  // Remove grid for export
  const gridEl = clone.querySelector('#grid-rect');
  if (gridEl) gridEl.setAttribute('fill', 'white');

  // Re-render into clone (by calling render functions directly)
  render();
  const svgSource = new XMLSerializer().serializeToString(svgEl);

  // Restore state
  State.panX = savedPan.x;
  State.panY = savedPan.y;
  State.scale = savedPan.s;
  render();

  // Build export SVG with correct viewBox
  const exportSVG = buildExportSVG(minX, minY, maxX, maxY, exportScale);

  // Render to canvas
  const img = new Image();
  const svgBlob = new Blob([exportSVG], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);

  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'floorplan.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 'image/png');
  };
  img.src = url;
}

function buildExportSVG(minX, minY, maxX, maxY, scale) {
  const width = (maxX - minX) * scale;
  const height = (maxY - minY) * scale;
  const offsetX = -minX * scale;
  const offsetY = -minY * scale;

  let svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
<rect width="${width}" height="${height}" fill="white"/>
<defs>
  <marker id="arr-end" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#0055bb"/>
  </marker>
  <marker id="arr-start" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto-start-reverse">
    <path d="M0,0 L6,3 L0,6 Z" fill="#0055bb"/>
  </marker>
  <marker id="arr-end-gray" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto">
    <path d="M0,0 L5,2.5 L0,5 Z" fill="#8899bb"/>
  </marker>
  <marker id="arr-start-gray" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto-start-reverse">
    <path d="M0,0 L5,2.5 L0,5 Z" fill="#8899bb"/>
  </marker>
</defs>
`;

  // Tile fills (drawn first so walls cover the tiles that fall under them).
  // Emitted as two paths (base, then accent on top) to match the screen render.
  const cellD = pts => {
    let d = '';
    for (let i = 0; i < pts.length; i++) d += (i === 0 ? 'M' : 'L') + (pts[i].x * scale + offsetX) + ' ' + (pts[i].y * scale + offsetY);
    return d + 'Z';
  };
  const excludedFurniture = State.furniture.filter(f => f.noFloor);
  const exclMaskShapes = () => excludedFurniture.map(f => {
    const cx = f.x * scale + offsetX, cy = f.y * scale + offsetY;
    const fw = f.width * scale, fh = f.height * scale, rot = f.rotation || 0;
    return f.type === 'circle'
      ? `<ellipse cx="${cx}" cy="${cy}" rx="${fw / 2}" ry="${fh / 2}" fill="black" transform="rotate(${rot} ${cx} ${cy})"/>`
      : `<rect x="${cx - fw / 2}" y="${cy - fh / 2}" width="${fw}" height="${fh}" fill="black" transform="rotate(${rot} ${cx} ${cy})"/>`;
  }).join('');
  for (const tf of State.tilefills) {
    if (!tf.roomPoly || tf.roomPoly.length < 3) continue;
    const { cells } = tileFillCells(tf);
    const clipId = `exptileclip-${tf.id}`;
    const clipPts = tf.roomPoly.map(p => `${p.x * scale + offsetX},${p.y * scale + offsetY}`).join(' ');
    svg += `<clipPath id="${clipId}" clipPathUnits="userSpaceOnUse"><polygon points="${clipPts}"/></clipPath>\n`;
    let maskRef = '';
    if (excludedFurniture.length) {
      const maskId = `exptilemask-${tf.id}`;
      svg += `<mask id="${maskId}" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="${width}" height="${height}" fill="white"/>${exclMaskShapes()}</mask>\n`;
      maskRef = ` mask="url(#${maskId})"`;
    }
    svg += `<g clip-path="url(#${clipId})"${maskRef}>\n`;
    svg += `<polygon points="${clipPts}" fill="${GROUT_COLOR}"/>\n`;
    let baseD = '', accentD = '';
    const painted = tf.painted || {};
    for (const cell of cells) {
      baseD += cellD(cell.pts);
      if (painted[cell.key]) accentD += cellD(cell.pts);
    }
    svg += `<path d="${baseD}" fill="${tf.baseColor}" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>\n`;
    if (accentD) svg += `<path d="${accentD}" fill="${tf.accentColor}" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>\n`;
    svg += `</g>\n`;
  }

  // Walls
  for (const w of State.walls) {
    const x1 = w.x1 * scale + offsetX, y1 = w.y1 * scale + offsetY;
    const x2 = w.x2 * scale + offsetX, y2 = w.y2 * scale + offsetY;
    const thick = Math.max((w.thickness ?? 0.5) * scale, 1.5);
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2c2c2c" stroke-width="${thick}" stroke-linecap="square"/>\n`;
  }

  // Openings (cutout + symbol)
  for (const o of State.openings) {
    const w = State.getWall(o.wallId);
    if (!w) continue;
    const { a, b, nx, ny, thick } = openingGeomExport(o, w, scale, offsetX, offsetY);
    const thickPx = thick * scale;

    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="white" stroke-width="${thickPx + 2}" stroke-linecap="butt"/>\n`;

    if (o.type === 'window') {
      const offsets = [-thick * 0.3 * scale, 0, thick * 0.3 * scale];
      for (const off of offsets) {
        const wa = { x: a.x + off * nx, y: a.y + off * ny };
        const wb = { x: b.x + off * nx, y: b.y + off * ny };
        svg += `<line x1="${wa.x}" y1="${wa.y}" x2="${wb.x}" y2="${wb.y}" stroke="#4169e1" stroke-width="${off === 0 ? 2 : 1}" fill="none"/>\n`;
      }
    } else {
      // Door simplified for export
      const { ux, uy } = wallDir(w);
      const halfW = o.width / 2;
      const cw = wallPoint(w, o.t);
      const hinge_side = o.hinge || (o.swing === 'right' ? 'right' : 'left');
      const swingDir   = o.swingDir || 'in';
      const swingSign  = swingDir === 'out' ? -1 : 1;
      const hingeW  = hinge_side === 'left'
        ? { x: cw.x - halfW * ux, y: cw.y - halfW * uy }
        : { x: cw.x + halfW * ux, y: cw.y + halfW * uy };
      const closedW = hinge_side === 'left'
        ? { x: cw.x + halfW * ux, y: cw.y + halfW * uy }
        : { x: cw.x - halfW * ux, y: cw.y - halfW * uy };
      const hinge = { x: hingeW.x * scale + offsetX, y: hingeW.y * scale + offsetY };
      const closedTip = { x: closedW.x * scale + offsetX, y: closedW.y * scale + offsetY };
      const r = o.width * scale;

      if (swingDir === 'none') {
        // opening only — gap already drawn above
      } else {
      const openTipW = {
        x: hingeW.x + swingSign * o.width * nx,
        y: hingeW.y + swingSign * o.width * ny,
      };
      const openTip = { x: openTipW.x * scale + offsetX, y: openTipW.y * scale + offsetY };
      svg += `<line x1="${hinge.x}" y1="${hinge.y}" x2="${openTip.x}" y2="${openTip.y}" stroke="#7a5c3a" stroke-width="2" fill="none"/>\n`;
      const cA = Math.atan2(closedTip.y - hinge.y, closedTip.x - hinge.x) * 180 / Math.PI;
      const oA = Math.atan2(openTip.y - hinge.y, openTip.x - hinge.x) * 180 / Math.PI;
      const sa = Math.min(cA, oA), ea = Math.max(cA, oA);
      svg += `<path d="${svgArc(hinge.x, hinge.y, r, sa, ea)}" stroke="#7a5c3a" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>\n`;
      } // end swingDir else
    } // end door else
  } // end openings loop

  // Furniture
  for (const f of State.furniture) {
    const cx = f.x * scale + offsetX, cy = f.y * scale + offsetY;
    const fw = f.width * scale, fh = f.height * scale;
    const rot = f.rotation || 0;
    const col = furnColors(f);
    if (f.type === 'circle') {
      svg += `<ellipse cx="${cx}" cy="${cy}" rx="${fw/2}" ry="${fh/2}" stroke="${col.stroke}" stroke-width="1.5" fill="${col.fill}" transform="rotate(${rot},${cx},${cy})"/>\n`;
    } else {
      svg += `<rect x="${cx-fw/2}" y="${cy-fh/2}" width="${fw}" height="${fh}" stroke="${col.stroke}" stroke-width="1.5" fill="${col.fill}" rx="3" transform="rotate(${rot},${cx},${cy})"/>\n`;
    }
    if (f.label) {
      svg += `<text x="${cx}" y="${cy}" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle" fill="${col.text}" transform="rotate(${rot},${cx},${cy})">${f.label}</text>\n`;
    }
  }

  // Labels
  for (const lbl of State.labels) {
    const cx = lbl.x * scale + offsetX, cy = lbl.y * scale + offsetY;
    const fsPx = lbl.fontSize * scale;
    svg += `<text x="${cx}" y="${cy}" font-size="${fsPx}" font-family="sans-serif" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#222">${lbl.text}</text>\n`;
  }

  // Dimensions
  if (State.showDimensions) {
    for (const w of State.walls) {
      if (w.hideDim) continue;
      const L = wallLength(w);
      if (L < 0.1) continue;
      const dir = wallDir(w);
      const ux = dir.ux, uy = dir.uy;
      const flip = w.flipDim ? -1 : 1;
      const nx = dir.nx * flip, ny = dir.ny * flip;
      const thick = w.thickness ?? 0.5;

      const d1 = innerTrimAt(w, w.x1, w.y1);
      const d2 = innerTrimAt(w, w.x2, w.y2);
      const assumed = State.interiorMode ? thick / 2 : 0;
      const assumed1 = d1 <= 0.02 ? assumed : 0;
      const assumed2 = d2 <= 0.02 ? assumed : 0;
      const innerOff = (thick * 0.5 + 0.55) * scale;

      // Inner-clear span, split into segments around mid-span intersecting walls.
      const s0 = d1, s1 = L - d2;
      for (const s of wallInnerSegments(w, s0, s1)) {
        let len = s.to - s.from;
        if (Math.abs(s.from - s0) < 1e-6) len -= assumed1;
        if (Math.abs(s.to - s1) < 1e-6) len -= assumed2;
        len = Math.max(1 / 12, len);
        const ax = (w.x1 + s.from * ux) * scale + offsetX, ay = (w.y1 + s.from * uy) * scale + offsetY;
        const bx = (w.x1 + s.to * ux) * scale + offsetX, by = (w.y1 + s.to * uy) * scale + offsetY;
        const adx = ax + nx * innerOff, ady = ay + ny * innerOff;
        const bdx = bx + nx * innerOff, bdy = by + ny * innerOff;
        const mx = (adx + bdx) / 2, my = (ady + bdy) / 2;
        svg += `<line x1="${ax}" y1="${ay}" x2="${adx}" y2="${ady}" stroke="#0055bb" stroke-width="0.75" stroke-dasharray="2,2"/>\n`;
        svg += `<line x1="${bx}" y1="${by}" x2="${bdx}" y2="${bdy}" stroke="#0055bb" stroke-width="0.75" stroke-dasharray="2,2"/>\n`;
        svg += `<line x1="${adx}" y1="${ady}" x2="${bdx}" y2="${bdy}" stroke="#0055bb" stroke-width="1" marker-start="url(#arr-start)" marker-end="url(#arr-end)"/>\n`;
        svg += `<rect x="${mx-22}" y="${my-9}" width="44" height="18" rx="3" fill="white"/>\n`;
        svg += `<text x="${mx}" y="${my}" font-size="11" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#0044aa">${fmtFt(len)}</text>\n`;
      }
    }

    // Outer-overall dims, merged across collinear wall runs.
    for (const run of wallRuns()) {
      if (run.every(isInteriorPartition)) continue;
      const w0 = run[0];
      const dir = wallDir(w0);
      const ux = dir.ux, uy = dir.uy;
      const flip = w0.flipDim ? -1 : 1;
      const nx = dir.nx * flip, ny = dir.ny * flip;
      const thick = w0.thickness ?? 0.5;

      let minP = Infinity, maxP = -Infinity, minPt = null, maxPt = null, minW = w0, maxW = w0;
      for (const w of run) {
        for (const ep of [{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }]) {
          const p = (ep.x - w0.x1) * ux + (ep.y - w0.y1) * uy;
          if (p < minP) { minP = p; minPt = ep; minW = w; }
          if (p > maxP) { maxP = p; maxPt = ep; maxW = w; }
        }
      }
      const d1 = innerTrimAt(minW, minPt.x, minPt.y);
      const d2 = innerTrimAt(maxW, maxPt.x, maxPt.y);
      if (d1 < 0.02 && d2 < 0.02) continue;

      const outerLen = (maxP - minP) + d1 + d2;
      const outerOff = (thick * 0.5 + 1.35) * scale;
      const op1x = (minPt.x - d1 * ux) * scale + offsetX, op1y = (minPt.y - d1 * uy) * scale + offsetY;
      const op2x = (maxPt.x + d2 * ux) * scale + offsetX, op2y = (maxPt.y + d2 * uy) * scale + offsetY;
      const od1x = op1x + nx * outerOff, od1y = op1y + ny * outerOff;
      const od2x = op2x + nx * outerOff, od2y = op2y + ny * outerOff;
      const omx = (od1x + od2x) / 2, omy = (od1y + od2y) / 2;

      svg += `<line x1="${op1x}" y1="${op1y}" x2="${od1x}" y2="${od1y}" stroke="#aabbd0" stroke-width="0.5" stroke-dasharray="2,2"/>\n`;
      svg += `<line x1="${op2x}" y1="${op2y}" x2="${od2x}" y2="${od2y}" stroke="#aabbd0" stroke-width="0.5" stroke-dasharray="2,2"/>\n`;
      svg += `<line x1="${od1x}" y1="${od1y}" x2="${od2x}" y2="${od2y}" stroke="#8899bb" stroke-width="0.75" marker-start="url(#arr-start-gray)" marker-end="url(#arr-end-gray)"/>\n`;
      svg += `<rect x="${omx-18}" y="${omy-7}" width="36" height="14" rx="2" fill="white"/>\n`;
      svg += `<text x="${omx}" y="${omy}" font-size="9" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle" fill="#6677aa">${fmtFt(outerLen)}</text>\n`;
    }
  }

  svg += '</svg>';
  return svg;
}

function openingGeomExport(o, w, scale, offsetX, offsetY) {
  const { ux, uy, nx, ny } = wallDir(w);
  const thick = (w.thickness ?? 0.5);
  const halfW = o.width / 2;
  const cWorld = wallPoint(w, o.t);
  const a = {
    x: (cWorld.x - halfW * ux) * scale + offsetX,
    y: (cWorld.y - halfW * uy) * scale + offsetY,
  };
  const b = {
    x: (cWorld.x + halfW * ux) * scale + offsetX,
    y: (cWorld.y + halfW * uy) * scale + offsetY,
  };
  return { a, b, nx, ny, thick };
}


// ===== main.js =====
document.addEventListener('DOMContentLoaded', () => {
  // Set initial pan so origin is near top-left with margin
  const canvas = document.getElementById('canvas');
  State.panX = 80;
  State.panY = 80;
  State.scale = 40;

  initUI();
  initTools();
  updateZoomLabel();
  setTool('wall');
  render();

  setHint('Click to start drawing walls. Double-click or Enter to finish a wall chain.');
});

</script>
